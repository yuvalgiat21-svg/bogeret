# שרת ההתראות של פורטל בוגרת — בודק כל 5 דקות אם יש משימות/הודעות חדשות ושולח התראה לטלפונים.
# גיטהאב מריץ לפעמים באיחור של כמה דקות. אפשר גם להריץ ידנית: Actions ← push ← Run workflow.
name: push
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: push
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: tools/push
      - run: node send.mjs
        working-directory: tools/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
