<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מרכז למידה · תיאום תגבורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#FC5028;--b:#8E033C;--bg:#FFF1EB;--ln:#F3C2B0;--t2:#7A6A66;--tx:#2B1D1A;--ok:#1E9E6A;--warn:#D98E04;--err:#C0261F;
 --sh:0 1px 2px rgba(142,3,60,.06),0 6px 18px rgba(142,3,60,.08);--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:Assistant,Arial,sans-serif;background:#FBF6F3;color:var(--tx);font-size:15px}
h1,h2,h3,h4,.hd{font-family:Heebo,Arial,sans-serif;margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #fc502855;border-color:var(--o)}
header{background:linear-gradient(115deg,var(--o),var(--b));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header .logo{font-family:Heebo;font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}
header .logo small{font-weight:500;font-size:13px;opacity:.85;display:block}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:12px;padding:4px;gap:4px;margin-inline-start:auto}
.seg button{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px}
.seg button.on{background:#fff;color:var(--b)}
nav{display:flex;gap:6px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--ln);overflow-x:auto;position:sticky;top:0;z-index:20}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--t2);white-space:nowrap;font-size:14.5px}
nav button.on{background:var(--bg);color:var(--b)}
nav button .n{background:var(--o);color:#fff;border-radius:9px;padding:0 7px;font-size:12px;margin-inline-start:4px}
main{padding:20px 22px 60px;max-width:1500px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--ln);background:#fff;color:var(--tx);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--o)}
.btn.pri{background:var(--o);border-color:var(--o);color:#fff}
.btn.pri:hover{background:#e54418}
.btn.dk{background:var(--b);border-color:var(--b);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--err)}
.panel{background:#fff;border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.panel h3{font-size:16px;color:var(--b);margin-bottom:10px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .v{font-family:Heebo;font-size:30px;font-weight:800;color:var(--b);line-height:1.1}
.kpi .l{color:var(--t2);font-size:13.5px;font-weight:600}
.kpi .s{font-size:12px;color:var(--t2);margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--bg);color:var(--b);border:1px solid var(--ln);white-space:nowrap}
.tag.ok{background:#E6F6EF;color:var(--ok);border-color:#BDE6D3}
.tag.warn{background:#FFF5DC;color:#9A6500;border-color:#F3DB9C}
.tag.err{background:#FDE8E6;color:var(--err);border-color:#F5C2BD}
.tag.gr{background:#F2EFEE;color:var(--t2);border-color:#E3DDDB}
.muted{color:var(--t2);font-size:13px}
.title{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.title h2{font-size:22px;color:var(--b)}
/* calendar */
.calwrap{display:grid;grid-template-columns:1fr 310px;gap:14px;align-items:start}
.calscroll{overflow-x:auto;background:#fff;border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh)}
.cal{display:grid;grid-template-columns:58px repeat(5,minmax(150px,1fr));min-width:820px}
.cal .ch{position:sticky;top:0;background:#fff;padding:10px 8px;text-align:center;font-family:Heebo;font-weight:700;border-bottom:1px solid var(--ln);font-size:14px;z-index:2}
.cal .ch small{display:block;font-weight:500;color:var(--t2);font-size:12px}
.cal .ch.today{color:var(--o)}
.cal .hr{padding:8px 6px;font-family:Heebo;font-weight:700;color:var(--t2);font-size:13px;border-bottom:1px solid #F6E3DA;text-align:center}
.cal .cell{border-bottom:1px solid #F6E3DA;border-inline-start:1px solid #F6E3DA;padding:5px;min-height:74px;display:flex;flex-direction:column;gap:5px}
.cal .cell.past{background:#FCFAF9}
.cal .cell.blk{background:repeating-linear-gradient(-45deg,#FBF3EF,#FBF3EF 6px,#fff 6px,#fff 12px);color:var(--t2);font-size:12px;align-items:center;justify-content:center}
.card{border-radius:10px;border:1px solid var(--ln);background:#fff;padding:6px 8px;border-inline-start:4px solid var(--c);cursor:pointer;transition:.15s;position:relative}
.card:hover{box-shadow:var(--sh)}
.card .t{font-size:12px;font-weight:700;color:var(--t2);display:flex;gap:6px;align-items:center}
.card .t .cnt{margin-inline-start:auto;font-family:Heebo}
.card .s{font-family:Heebo;font-weight:700;font-size:13.5px;margin:2px 0 4px}
.card.ghost{background:transparent;border-style:dashed;border-inline-start-width:1px;padding:3px 8px;opacity:.75}
.card.ghost .t:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.card.full .cnt{color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);cursor:grab;white-space:nowrap;font-weight:600}
.chip.att1{background:#E6F6EF;border-color:#BDE6D3}
.chip.att0{background:#FDE8E6;border-color:#F5C2BD;text-decoration:line-through}
body.dragging .card.dim{opacity:.25}
body.dragging .card.tgt{outline:2px dashed var(--ok);background:#F1FBF6;opacity:1}
.card.over{outline:3px solid var(--ok)!important;transform:scale(1.03)}
.side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.rq{border:1px solid var(--ln);border-radius:12px;padding:9px 11px;margin-bottom:8px;background:#fff;cursor:grab;transition:.15s}
.rq:hover{border-color:var(--o);box-shadow:var(--sh)}
.rq b{font-family:Heebo}
.drop-un{border:2px dashed transparent;border-radius:12px;padding:4px;transition:.15s}
body.dragging .drop-un.chipdrag{border-color:var(--err);background:#FFF6F5}
/* tables */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:right;color:var(--t2);font-weight:700;font-size:13px;padding:8px;border-bottom:1px solid var(--ln);background:#FFF9F6;position:sticky;top:0}
.tb td{padding:9px 8px;border-bottom:1px solid #F6E3DA;vertical-align:middle}
.tb tr:hover td{background:#FFFBF9}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:Heebo;font-size:13px;flex:none}
.tcards{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tcard{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border-top:5px solid var(--c)}
.bar{height:8px;background:#F6E3DA;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--o);border-radius:8px}
.bars .br{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin-bottom:8px;font-size:13.5px}
.bars .two{position:relative;height:16px;background:#F6E3DA;border-radius:6px;overflow:hidden}
.bars .two i{position:absolute;top:0;bottom:0;right:0;border-radius:6px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;border:1px solid}
.alert.err{background:#FDF0EE;border-color:#F5C2BD}.alert.warn{background:#FFF8E6;border-color:#F3DB9C}.alert.ok{background:#EEF9F4;border-color:#BDE6D3}.alert.info{background:var(--bg);border-color:var(--ln)}
/* painter */
.painter{display:grid;grid-template-columns:52px repeat(5,1fr);gap:3px;user-select:none;margin-top:6px}
.painter .ph{font-size:12px;font-weight:700;text-align:center;color:var(--t2);padding:3px}
.pc{height:30px;border-radius:7px;background:#F6EFEC;border:1px solid #EEE2DC;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;color:transparent}
.pc.on{background:var(--pcol,var(--o));border-color:transparent;color:#fff}
.pc.x{background:repeating-linear-gradient(-45deg,#F4ECE8,#F4ECE8 4px,#fff 4px,#fff 8px);cursor:not-allowed}
/* modal */
#modal{position:fixed;inset:0;background:rgba(43,29,26,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 14px;overflow:auto}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease}
.mbox .mh{padding:16px 20px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px}
.mbox .mh h3{font-size:18px;color:var(--b)}
.mbox .mb{padding:18px 20px}
.mbox .mf{padding:12px 20px;border-top:1px solid var(--ln);display:flex;gap:8px;justify-content:flex-start;background:#FFFAF8;border-radius:0 0 18px 18px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-weight:700;font-size:13.5px;color:var(--t2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--ln);background:#fff;border-radius:20px;padding:6px 12px;font-weight:700;font-size:13.5px;color:var(--tx)}
.pick button.on{background:var(--o);border-color:var(--o);color:#fff}
.pick button.on.lv{background:var(--b);border-color:var(--b)}
.subrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #F3DDD3;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.opt .dt{font-family:Heebo;font-weight:800;color:var(--b);min-width:86px;text-align:center;line-height:1.15}
.opt .dt small{display:block;font-weight:500;color:var(--t2);font-size:12px}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
#toasts{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--tx);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh);font-weight:600;animation:pop .2s;max-width:360px}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}
/* student mobile */
.phone{max-width:560px;margin:0 auto}
.hero{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.hero h2{font-size:22px;color:var(--b)}
.big{width:100%;padding:14px;font-size:16px;border-radius:14px;justify-content:center}
.ses{display:flex;gap:12px;align-items:center;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px;background:#fff;border-inline-start:5px solid var(--c)}
.step{font-family:Heebo;font-weight:700;margin:14px 0 8px;color:var(--b)}
.empty{text-align:center;color:var(--t2);padding:26px 10px;font-size:14px}
.feed div{padding:7px 0;border-bottom:1px dashed #F3DDD3;font-size:13.5px}
.feed small{color:var(--t2);margin-inline-end:6px}
.seg{flex-wrap:wrap}
body.embedded header{padding:8px 14px}body.embedded header .logo{font-size:16px}body.embedded header .logo>span{display:none}body.embedded main{padding-top:14px}
.bell{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:7px 11px;font-size:16px;position:relative}
.bell .n{position:absolute;top:-6px;left:-6px;background:#fff;color:var(--b);border-radius:9px;font-size:11px;padding:0 6px;font-weight:800}
.rolebar{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:9px 14px;margin-bottom:14px;font-size:14px;color:var(--t2)}
.rolebar b{color:var(--b)}
.ucal{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:3px;margin-top:10px}
.ucal .ph{font-size:12px;font-weight:700;text-align:center;color:var(--t2);padding:3px}
.uc{min-height:44px;border-radius:8px;background:#FAF5F2;border:1px solid #F1E4DE;padding:3px;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.uc.cf{border:2px solid var(--err);background:#FFF4F3}
.ub{font-size:11.5px;border-radius:5px;padding:1px 5px;background:#fff;border:1px solid #eee;border-inline-start:3px solid var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub.pend{border-style:dashed;opacity:.8}
.cfi{position:absolute;top:-9px;left:-6px;font-size:13px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--t2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--k);margin-inline-end:4px}
@media (max-width:1100px){.seg button span{display:none}.seg button{font-size:18px}}
@media (max-width:1000px){.calwrap{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media (max-width:640px){main{padding:14px 12px 60px}header{padding:12px 14px}.seg{margin-inline-start:0;width:100%}.seg button{flex:1;padding:7px 6px}.f2{grid-template-columns:1fr}nav{padding:8px 12px}}
@media print{header,nav,.side,.noprint,#toasts{display:none!important}.calwrap{display:block}.calscroll{box-shadow:none;border:0}body{background:#fff}}
</style>
</head>
<body>
<header>
  <div class="logo"><span style="font-size:26px">📚</span><div>מרכז למידה · תיאום תגבורים<small>שכבה בוגרת · מבואות ים</small></div></div>
  <div class="seg" id="roleSw"></div>
  <button class="bell" id="bell" onclick="openNotes()" aria-label="התראות"></button>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>
<script>
/* ============ קבועים ============ */
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי'];
const SUBJECTS=['מתמטיקה','אנגלית','לשון','היסטוריה','תנ"ך','ספרות','אזרחות','פיזיקה','ביולוגיה','כימיה','מחשבים'];
const LEVELED=['מתמטיקה','אנגלית'];
const REASONS={'בגרות':25,'מבחן קרוב':20,'ציון נמוך':15,'השלמת חומר':10,'חיזוק כללי':5};
const COLORS=['#FC5028','#8E033C','#1E9E6A','#2C6FD1','#8A4FD6','#D98E04','#0E9AA7','#D6457A','#5A6B7B','#7B9A1E'];
const KEY='bogeret_tigburim_demo_v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

/* ============ תאריכים ============ */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const weekOf=s=>{const d=new Date((s||todayIso())+'T12:00:00');d.setDate(d.getDate()-d.getDay());return iso(d)};
const todayIso=()=>iso(new Date());
const fmt=s=>{const p=s.split('-');return (+p[2])+'.'+(+p[1])};
const diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const dateOf=(w,d)=>addDays(w,d);
const isPast=(w,d,h)=>{const dt=dateOf(w,d),t=todayIso();return dt<t||(dt===t&&h<=new Date().getHours())};
const sk=(w,d,h,t)=>`${w}|${d}|${h}|${t}`;
const pk=k=>{const [w,d,h,t]=k.split('|');return {w,d:+d,h:+h,t}};
const hh=h=>`${String(h).padStart(2,'0')}:00`;

/* ============ מצב ============ */
let S=null;
/* ── מצב חי: כשהדף פתוח בתוך פורטל בוגרת — משתמשים בכניסה, ברשימת החניכים ובאזור המוגן של הפורטל ── */
const P=(()=>{try{return window.parent!==window&&window.parent.LC_BRIDGE?window.parent.LC_BRIDGE:null}catch(e){return null}})();
const LIVE=!!P;
/* ?only=exits — מצב "אישורי יציאה" בתוך לשונית הנוכחות בפורטל · ?nav=new — בסרגל החדש היציאות לא מופיעות כאן */
const QS=new URLSearchParams(location.search), ONLY=QS.get('only')||'', NAVNEW=QS.get('nav')==='new';
const LC_PATH='portal/bogeret/secure/lc';
const COLS=['settings','teachers','requests','sessions','activities','exits','notes','fixedGroups','log','sync','stu'];
let LAST={},DB=null,ALLOWED=null,MY_GROUPS=null,ME_N='';
let UI={grp:'',calSid:null,gs:'מתמטיקה',role:'coord',tab:'dash',week:weekOf(),tid:null,sid:null,f:{t:'',s:''},rf:{st:'pending',s:'',q:''},sw:null,paint:{}};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){if(LIVE)return liveSave();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function log(msg){S.log.unshift({ts:Date.now(),msg:LIVE&&ME_N?`${msg} (${ME_N})`:msg});S.log=S.log.slice(0,100)}
function blankState(){return {settings:{hours:[14,15,16,17,18,19,20],blocked:[19],max:4},teachers:[],requests:[],sessions:{},activities:[],exits:[],notes:[],fixedGroups:[],log:[],sync:{date:'',src:'סמרט סקול'},stu:{},students:[]}}
function buildStudents(){
  S.students=(P.students()||[]).filter(s=>s&&s.n).map(s=>{const x=S.stu[s.n]||{};return {id:s.n,name:s.n,grade:String(s.l||'').replace(/['׳"]/g,''),group:s.g||'',busy:x.busy||[],levels:x.levels||{},code:''}});
}
function applyRemote(v){
  if(!S)S=blankState();let ch=false;const b=blankState();
  for(const c of COLS){const str=v[c];if(str===LAST[c])continue;LAST[c]=str;try{S[c]=str?JSON.parse(str):b[c]}catch(e){S[c]=b[c]}ch=true}
  buildStudents();return ch;
}
function liveSave(){
  if(!DB)return;const up={};
  for(const c of COLS){const str=JSON.stringify(S[c]);if(str!==LAST[c]){LAST[c]=str;up[c]=str}}
  if(Object.keys(up).length)DB.dbm.update(DB.dbm.ref(DB.rdb,LC_PATH),up).catch(e=>toast('השמירה נכשלה — בדקו חיבור לאינטרנט','err'));
}
function madrichGroups(me){
  const all=[...new Set(S.students.map(s=>s.group))];
  const named=all.filter(g=>g&&String(me.r||'').includes(g));
  if(named.length)return named;
  if(me.scope==='academy')return all.filter(g=>g==='אקדמיה');
  if(me.scope==='ya')return all.filter(g=>S.students.some(s=>s.group===g&&s.grade==='יא'));
  if(me.scope==='yb')return all.filter(g=>S.students.some(s=>s.group===g&&s.grade==='יב'));
  return all;
}
function setupRole(){
  const me=P.me()||{};ME_N=me.n||'';
  if(ONLY==='exits'){ALLOWED=['madrich'];UI.role='madrich';UI.tab='exits';
    MY_GROUPS=(me.mode==='admin'||me.lc||me.scope==='all')?null:madrichGroups(me);UI.grp=MY_GROUPS?(MY_GROUPS[0]||''):'';

/* ============ מנוע השיבוץ ============ */
function prio(r){
  let p=REASONS[r.reason]||5;
  if(r.exam){const dd=diff(todayIso(),r.exam);p+=dd<=3?40:dd<=7?25:dd<=14?10:0}
  p+=Math.min(20,Math.floor((Date.now()-r.created)/864e5)*3);

}
function prioTag(r){const p=prio(r);return p>=50?'<span class="tag err">🔥 דחוף</span>':p>=30?'<span class="tag warn">גבוה</span>':'<span class="tag gr">רגיל</span>'}
function studentBusyAt(sid,w,d,h,ignore){
  const pre=`${w}|${d}|${h}|`;
  return Object.entries(S.sessions).some(([k,s])=>k!==ignore&&k.startsWith(pre)&&s.students.includes(sid));
}
function sessionsOfStudent(sid){return Object.entries(S.sessions).filter(([k,s])=>s.students.includes(sid)).map(([k,s])=>({key:k,...pk(k),s}))}
function teacherLoad(tid,w){return Object.entries(S.sessions).filter(([k,s])=>k.startsWith(w+'|')&&k.endsWith('|'+tid)&&s.students.length).length}
function nextWeeks(n=3){const w=weekOf();return Array.from({length:n},(_,i)=>addDays(w,7*i))}

function candidates(r,weeks,o={}){
  const st=ST(r.sid);if(!st)return[];
  const lvl=reqLevel(r),out=[],now=todayIso();
  for(const w of weeks)for(const t of S.teachers){
    if(!teaches(t,r.subject,lvl))continue;
    for(const a of t.avail){
      const [d,h]=a.split('-').map(Number);
      if(blocked(h)||!S.settings.hours.includes(h))continue;
      if(!o.allowPast&&isPast(w,d,h))continue;
      const date=dateOf(w,d);
      if(r.exam&&date>r.exam)continue;
      if(blockers(r.sid,w,d,h).length)continue;
      const key=sk(w,d,h,t.id);
      if(key===o.ignoreKey)continue;
      if(studentBusyAt(r.sid,w,d,h,o.ignoreKey))continue;
      const s=S.sessions[key],n=s?s.students.length:0;
      if(n&&(s.subject!==r.subject||(s.level&&lvl&&s.level!==lvl)))continue;
      if(n>=t.max)continue;
      let sc=50;const why=[];
      if(n){sc+=25;why.push(['ok',`מצטרפים לקבוצה (${n})`])}else why.push(['gr','תגבור חדש']);
      if(r.exam){const b=diff(date,r.exam);if(b>=1&&b<=3){sc+=20;why.push(['ok',`${b} ימים לפני המבחן`])}else if(b===0){sc-=15;why.push(['warn','ביום המבחן עצמו'])}}
      const off=Math.max(0,diff(now,date));sc-=off*1.2;
      if(off<=2)why.push(['ok','בקרוב']);
      if(r.pref&&r.pref.length&&r.pref.includes(d)){sc+=10;why.push(['ok','יום מועדף'])}
      if(sessionsOfStudent(r.sid).some(x=>x.key!==o.ignoreKey&&x.w===w&&x.d===d)){sc-=12;why.push(['warn','עוד תגבור באותו יום'])}
      sc-=teacherLoad(t.id,w)*0.8;
      if(lvl&&t.subjects[r.subject].includes(lvl))sc+=3;
      out.push({key,w,d,h,t,date,n,score:Math.round(sc),why});
    }
  }
  return out.sort((a,b)=>b.score-a.score);
}
function noMatchReason(r){
  const lvl=reqLevel(r);
  if(!S.teachers.some(t=>teaches(t,r.subject,lvl)))return `אין מורה ל${subjLabel(r.subject,lvl)}`;
  if(r.exam&&r.exam<todayIso())return 'מועד המבחן כבר עבר';
  return 'אין חלון זמן משותף לחניך/ה ולמורה';
}
function removeFromSession(key,sid){
  const s=S.sessions[key];if(!s)return;
  s.students=s.students.filter(x=>x!==sid);delete s.att[sid];
  if(!s.students.length&&!s.note)delete S.sessions[key];
}
function assign(rid,key,o={}){
  const r=R(rid);if(!r)return false;
  const p=pk(key),t=T(p.t);
  if(!o.force){
    const ok=candidates(r,[p.w],{ignoreKey:r.status==='assigned'?r.key:null}).some(c=>c.key===key);
    if(!ok){toast('אי אפשר לשבץ כאן: התנגשות במערכת, אין התאמה למקצוע או שהקבוצה מלאה','err');return false}
  }
  if(r.status==='assigned'&&r.key)removeFromSession(r.key,r.sid);
  const s=S.sessions[key]||(S.sessions[key]={subject:r.subject,level:reqLevel(r),students:[],att:{},note:''});
  if(!s.students.length){s.subject=r.subject;s.level=reqLevel(r)}
  s.students.push(r.sid);
  r.status='assigned';r.key=key;r.assignedAt=Date.now();
  if(!o.silent)log(`${ST(r.sid).name} שובצ/ה ל${r.subject} אצל ${t.name}, יום ${DAYS[p.d]} ${fmt(dateOf(p.w,p.d))} ${hh(p.h)}`);
  return true;
}
function unassign(rid,close){
  const r=R(rid);if(!r)return;
  if(r.key)removeFromSession(r.key,r.sid);
  r.key=null;r.status=close?'closed':'pending';
}
function autoAssign(o={}){
  const weeks=o.weeks||nextWeeks(3);
  const list=S.requests.filter(r=>r.status==='pending').sort((a,b)=>prio(b)-prio(a));
  const ok=[],fail=[];
  for(const r of list){
    const c=candidates(r,weeks,{allowPast:o.allowPast})[0];
    if(c){assign(r.id,c.key,{force:true,silent:o.silent});ok.push([r,c])}else fail.push(r);
  }
  return {ok,fail};
}

function weekStats(w){
  const ses=Object.entries(S.sessions).filter(([k,s])=>k.startsWith(w+'|')&&s.students.length);
  let avail=0;S.teachers.forEach(t=>t.avail.forEach(a=>{if(!blocked(+a.split('-')[1]))avail++}));
  const studs=new Set();ses.forEach(([k,s])=>s.students.forEach(x=>studs.add(x)));
  let att=0,attN=0;ses.forEach(([k,s])=>Object.values(s.att).forEach(v=>{attN++;if(v)att++}));
  return {ses,avail,studs,att,attN,places:ses.reduce((a,[k,s])=>a+s.students.length,0)};
}
function vDash(){
  const w=weekOf(),st=weekStats(w),pend=S.requests.filter(r=>r.status==='pending');
  const util=st.avail?Math.round(st.ses.length/st.avail*100):0;
  const urgent=pend.filter(r=>r.exam&&diff(todayIso(),r.exam)<=4);

  if(old.length)alerts.push(['warn','⏳',`<b>${old.length} פניות ממתינות מעל 3 ימים</b>`,`go('req')`,'לטיפול']);

  if(pex.length)alerts.push(['warn','🚪',`<b>${pex.length} בקשות יציאה מתנגשות בתגבור</b> — ממתינות להחלטת המדריך/ה`,'','']);
  if(cfs.length)alerts.push(['warn','📅',`<b>${cfs.length} התנגשויות ביומני חניכים השבוע</b> (שיעורים, חוגים, תגבורים, יציאות)`,`go('calendars')`,'ליומנים']);
  if(solo.length)alerts.push(['warn','👤',`<b>${solo.length} תגבורים עם חניך/ה אחד/ת</b> — אפשר לאחד ולפנות שעות מורה`,`go('cal')`,'ללוח']);
  if(pend.length&&!urgent.length&&!nomatch.length)alerts.push(['info','⚡',`יש ${pend.length} פניות ממתינות. שיבוץ אוטומטי ימצא להן את הזמן הטוב ביותר.`,`runAuto()`,'שבצו עכשיו']);
  if(!alerts.length)alerts.push(['ok','✅','הכל מתוקתק — אין פניות פתוחות או התנגשויות']);
  // ביקוש מול היצע

  // היום

  return `<div class="title"><h2>בוקר טוב 👋</h2><span class="muted">שבוע ${fmt(w)}–${fmt(addDays(w,4))}</span><span class="sp"></span><button class="btn pri" onclick="runAuto()">⚡ שיבוץ אוטומטי</button><button class="btn" onclick="newReqModal()">➕ פנייה חדשה</button></div>
  <div class="grid kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="l">פניות ממתינות</div><div class="v" style="color:${pend.length?'var(--o)':'var(--ok)'}">${pend.length}</div><div class="s">${urgent.length} דחופות</div></div>
    <div class="kpi"><div class="l">תגבורים השבוע</div><div class="v">${st.ses.length}</div><div class="s">${st.places} מקומות תפוסים</div></div>
    <div class="kpi"><div class="l">חניכים שמתוגברים</div><div class="v">${st.studs.size}</div><div class="s">מתוך ${S.students.length} בשכבה</div></div>
    <div class="kpi"><div class="l">ניצולת שעות מורים</div><div class="v">${util}%</div><div class="bar" style="margin-top:6px"><i style="width:${util}%"></i></div></div>
    <div class="kpi"><div class="l">הגעה לתגבורים</div><div class="v">${st.attN?Math.round(st.att/st.attN*100)+'%':'—'}</div><div class="s">${st.att} מתוך ${st.attN} שסומנו</div></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
    <div class="panel"><h3>מה דורש תשומת לב</h3>${alerts.map(a=>`<div class="alert ${a[0]}"><span>${a[1]}</span><div class="sp">${a[2]}</div>${a[3]?`<button class="btn sm" onclick="${a[3]}">${a[4]}</button>`:''}</div>`).join('')}</div>
    <div class="panel"><h3>היום ${td<=4?'· יום '+DAYS[td]:''}</h3>${today.length?today.map(([k,s])=>{const p=pk(k),t=T(p.t);return `<div class="ses" style="--c:${t.color};cursor:pointer" onclick="openSession('${k}')"><div class="hd" style="font-weight:800;color:var(--b)">${hh(p.h)}</div><div class="sp"><b>${esc(subjLabel(s.subject,s.level))}</b><div class="muted">${esc(t.name)} · ${esc(t.room)} · ${s.students.map(i=>esc(ST(i).name)).join(', ')}</div></div><span class="tag">${s.students.length}/${t.max}</span></div>`}).join(''):'<div class="empty">אין תגבורים היום</div>'}</div>
    <div class="panel"><h3>ביקוש מול היצע לפי מקצוע</h3><div class="muted" style="margin-bottom:10px"><span style="color:var(--o)">■</span> פניות פתוחות ומשובצות &nbsp; <span style="color:#F3C2B0">■</span> קיבולת שבועית של מורים</div><div class="bars">${bars}</div></div>
    <div class="panel"><h3>פעילות אחרונה</h3><div class="feed">${S.log.slice(0,9).map(l=>`<div><small>${new Date(l.ts).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}</small>${esc(l.msg)}</div>`).join('')||'<div class="empty">עדיין אין פעילות</div>'}</div></div>
  </div>`;
}

/* ============ לוח שבועי ============ */
function calGrid(o={}){
  const w=UI.week,td=todayIso(),hours=S.settings.hours;
  let h=`<div class="cal"><div class="ch"></div>`+DAYS.map((d,i)=>{const dt=dateOf(w,i);return `<div class="ch ${dt===td?'today':''}">${d}<small>${fmt(dt)}</small></div>`}).join('');
  for(const hr of hours){
    h+=`<div class="hr">${hh(hr)}</div>`;
    for(let d=0;d<5;d++){
      if(blocked(hr)){h+=`<div class="cell blk">ארוחת ערב · חסום</div>`;continue}
      const past=isPast(w,d,hr);
      const ts=S.teachers.filter(t=>(!o.tid||t.id===o.tid)&&(!UI.f.t||o.tid||t.id===UI.f.t)&&(t.avail.includes(`${d}-${hr}`)||(S.sessions[sk(w,d,hr,t.id)]||{students:[]}).students.length));
      const cards=ts.map(t=>{
        const key=sk(w,d,hr,t.id),s=S.sessions[key];
        if(UI.f.s&&!o.tid&&!(s&&s.students.length&&s.subject===UI.f.s)&&!(!(s&&s.students.length)&&t.subjects[UI.f.s]!==undefined))return '';
        const dnd=o.noDnd?'':`ondragover="dOver(event)" ondragleave="dLeave(event)" ondrop="dDrop(event,'${key}')"`;
        if(s&&s.students.length){
          const full=s.students.length>=t.max;
          return `<div class="card ${full?'full':''}" style="--c:${t.color}" data-key="${key}" ${dnd} onclick="openSession('${key}')"><div class="t">${esc(o.tid?t.room:t.name)}<span class="cnt">${s.students.length}/${t.max}</span></div><div class="s">${esc(subjLabel(s.subject,s.level))}</div><div class="chips">${s.students.map(id=>`<span class="chip ${s.att[id]===true?'att1':s.att[id]===false?'att0':''}" ${o.noDnd?'':`draggable="true" ondragstart="dragChip(event,'${key}','${id}')" ondragend="dragEnd()"`}>${esc(ST(id).name)}</span>`).join('')}</div></div>`;
        }
        if(past)return '';
        return `<div class="card ghost" style="--c:${t.color}" data-key="${key}" ${dnd} title="${esc(t.name)} פנוי/ה · ${esc(Object.keys(t.subjects).join(', '))}"><div class="t">${o.tid?'זמין/ה':esc(t.name)}</div></div>`;
      }).join('');
      h+=`<div class="cell ${past?'past':''}">${cards}</div>`;
    }
  }
  return h+'</div>';
}

let PAINT=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.pc[data-p]');if(!c)return;e.preventDefault();const id=c.parentElement.dataset.pid,set=UI.paint[id],k=c.dataset.p,v=!set.has(k);PAINT={id,v};v?set.add(k):set.delete(k);c.classList.toggle('on',v)});

function saveTeacher(ex){
  const t=_et;t.name=$('#et_n').value.trim();t.room=$('#et_r').value.trim()||'—';t.max=Math.max(1,+$('#et_m').value||4);t.avail=[...UI.paint.t];

  const i=S.teachers.findIndex(x=>x.id===t.id);i<0?S.teachers.push(t):S.teachers[i]=t;
  log(`${ex?'עודכנו פרטי':'נוסף/ה'} המורה ${t.name}`);closeModal();commit('המורה נשמר/ה ✓');
}
function delTeacher(id){
  const t=T(id);if(!confirm(`למחוק את ${t.name}? החניכים בתגבורים שלה/שלו יחזרו לרשימת הממתינים.`))return;
  Object.keys(S.sessions).filter(k=>k.endsWith('|'+id)).forEach(k=>S.sessions[k].students.slice().forEach(sid=>{const r=reqAt(k,sid);r?unassign(r.id):removeFromSession(k,sid)}));
  Object.keys(S.sessions).filter(k=>k.endsWith('|'+id)).forEach(k=>delete S.sessions[k]);
  S.teachers=S.teachers.filter(x=>x.id!==id);log(`נמחק/ה המורה ${t.name}`);closeModal();commit('נמחק');
}

const TS={school:['#5A6B7B','שיעור'],act:['#8A4FD6','חוג'],tutor:['#FC5028','תגבור'],exit:['#D98E04','יציאה מאושרת'],exitp:['#D98E04','יציאה ממתינה'],meal:['#B9A9A3','ארוחה']};
function blockers(sid,w,d,h){
  const st=ST(sid),a=`${d}-${h}`,out=[],date=dateOf(w,d);
  if(st&&st.busy.includes(a))out.push({type:'school',label:'שיעור בבית הספר'});
  S.activities.forEach(ac=>{if(ac.slots.includes(a)&&ac.participants.includes(sid))out.push({type:'act',label:ac.name,id:ac.id})});
  S.exits.forEach(e=>{if(e.sid===sid&&e.status==='approved'&&e.date===date&&h>=e.from&&h<e.to)out.push({type:'exit',label:'יציאה · '+e.reason,id:e.id})});
  return out;
}
function cellItems(sid,w,d,h){
  const it=blockers(sid,w,d,h);
  if(blocked(h))it.push({type:'meal',label:'ארוחת ערב'});
  Object.keys(S.sessions).forEach(k=>{if(k.startsWith(`${w}|${d}|${h}|`)&&S.sessions[k].students.includes(sid)){const s=S.sessions[k];it.push({type:'tutor',label:`תגבור ${s.subject} · ${T(pk(k).t).name}`,key:k})}});
  return it;
}
function isCf(it){const real=it.filter(x=>x.type!=='meal');return real.length>1||(real.length<it.length&&real.some(x=>x.type==='act'||x.type==='tutor'))}
function conflictsOf(sid,w){const out=[];for(const h of S.settings.hours)for(let d=0;d<5;d++){const it=cellItems(sid,w,d,h);if(isCf(it))out.push({sid,w,d,h,items:it})}return out}
function allConflicts(w,grp){return S.students.filter(s=>!grp||grpOf(s)===grp).flatMap(s=>conflictsOf(s.id,w))}
function legend(){return `<div class="legend">${Object.values(TS).filter((v,i)=>i!==4).map(([c,l])=>`<span><i style="--k:${c}"></i>${l}</span>`).join('')}<span>⚠️ התנגשות</span></div>`}
function ucal(sid,w){
  let h=`<div class="ucal"><div></div>`+DAYS.map((d,i)=>`<div class="ph">${d}<br><small style="font-weight:500">${fmt(dateOf(w,i))}</small></div>`).join('');
  for(const hr of S.settings.hours){
    h+=`<div class="ph">${hh(hr)}</div>`;
    for(let d=0;d<5;d++){
      const it=cellItems(sid,w,d,hr),date=dateOf(w,d);
      const pe=S.exits.filter(e=>e.sid===sid&&e.status==='pending'&&e.date===date&&hr>=e.from&&hr<e.to);
      const cf=isCf(it);
      h+=`<div class="uc ${cf?'cf':''}" title="${esc(it.map(x=>x.label).join(' / '))}">${it.map(x=>`<div class="ub" style="--k:${TS[x.type][0]}">${esc(x.label)}</div>`).join('')}${pe.map(e=>`<div class="ub pend" style="--k:${TS.exitp[0]}">⏳ ${esc(e.reason)}</div>`).join('')}${cf?'<span class="cfi">⚠️</span>':''}</div>`;
    }
  }
  return h+'</div>';
}

/* ============ אישורי יציאה (מדריכים) ============ */
function exitDay(e){return new Date(e.date+'T12:00:00').getDay()}
function exitConflicts(e){
  const w=weekOf(e.date),d=exitDay(e),out=[];if(d>4)return out;
  for(let h=e.from;h<e.to;h++){
    Object.entries(S.sessions).forEach(([k,s])=>{if(k.startsWith(`${w}|${d}|${h}|`)&&s.students.includes(e.sid))out.push({type:'tutor',key:k,label:`תגבור ${s.subject} ב-${hh(h)} אצל ${T(pk(k).t).name}`})});
    S.activities.forEach(a=>{if(a.slots.includes(`${d}-${h}`)&&a.participants.includes(e.sid))out.push({type:'act',label:`${a.name} ב-${hh(h)}`})});
    if(ST(e.sid).busy.includes(`${d}-${h}`))out.push({type:'school',label:`שיעור ב-${hh(h)}`});
  }
  return out;
}
/* אישור יציאה = מדריך/ה + הורים (הכרעת יובל 27.11.2026). היציאה "מאושרת" רק כששניהם אישרו */
function exitTag(e){
  if(e.status==='approved')return '<span class="tag ok">✓ אושר</span>';
  if(e.status==='rejected')return '<span class="tag err">✕ לא אושר</span>';
  return `<span class="tag ${e.madOk?'ok':'warn'}" style="margin:1px">${e.madOk?'✓':'⏳'} מדריך/ה</span><span class="tag ${e.parOk?'ok':'warn'}" style="margin:1px">${e.parOk?'✓':'⏳'} הורים</span>${e.parOk&&e.parOk.how?`<div class="muted" style="font-size:11px">הורים: ${esc(e.parOk.how)}${e.parOk.who?' · '+esc(e.parOk.who):''}</div>`:''}`}
function vExits(){
  if(!UI.grp){const p=S.exits.find(e=>e.status==='pending');UI.grp=p?grpOf(ST(p.sid)):GROUPS()[0]}
  const ex=S.exits.filter(e=>grpOf(ST(e.sid))===UI.grp).sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||a.date.localeCompare(b.date));
  return `<div class="title"><h2>אישורי יציאה</h2>${grpSel()}<span class="sp"></span><button class="btn pri" onclick="newExitModal('','madrich')">➕ יציאה חדשה</button></div>
  <div class="panel" style="overflow-x:auto"><table class="tb"><thead><tr><th>חניך/ה</th><th>מתי</th><th>סיבה</th><th>מה יתפספס</th><th>סטטוס</th><th></th></tr></thead><tbody>
  ${ex.map(e=>{const cf=exitConflicts(e);return `<tr><td><b>${esc(ST(e.sid).name)}</b><div class="muted">ביקש/ה: ${esc(e.by)}</div></td><td>${DAYS[exitDay(e)]||'סופ"ש'} ${fmt(e.date)}<div class="muted">${hh(e.from)}–${hh(e.to)}</div></td><td>${esc(e.reason)}</td>
   <td>${cf.map(c=>`<span class="tag ${c.type==='tutor'?'err':'warn'}" style="margin:2px">${c.type==='tutor'?'📚':c.type==='act'?'🎭':'🏫'} ${esc(c.label)}</span>`).join('')||'<span class="tag ok">אין התנגשות</span>'}</td>
   <td>${exitTag(e)}</td><td style="white-space:nowrap">${e.status==='pending'?`${e.madOk?'':`<button class="btn sm pri" onclick="approveExit('${e.id}')">✓ אישור מדריך/ה</button> `}${e.parOk?'':`<button class="btn sm" onclick="parentOkModal('${e.id}')">👪 הורים אישרו</button> `}<button class="btn sm ghost danger" onclick="decideExit('${e.id}',false)">✕ דחייה</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">אין בקשות יציאה בקבוצה הזו</div></td></tr>'}
  </tbody></table></div>`;
}
function approveExit(id){
  const e=S.exits.find(x=>x.id===id),tu=exitConflicts(e).filter(c=>c.type==='tutor');
  if(!tu.length)return decideExit(id,true);
  openModal(`<div class="mh"><h3>⚠️ היציאה מתנגשת בתגבור</h3><span class="sp"></span><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mb">
   <p><b>${esc(ST(e.sid).name)}</b> מבקש/ת לצאת ב-${fmt(e.date)} בין ${hh(e.from)} ל-${hh(e.to)}, ויש לו/ה באותו זמן:</p>
   ${tu.map(c=>`<div class="alert err"><span>📚</span><div>${esc(c.label)}</div></div>`).join('')}
   <p class="muted">אם מאשרים, התגבור חוזר אוטומטית לרשימת הממתינים, ורכזת מרכז הלמידה מקבלת התראה כדי לשבץ זמן אחר.</p>
  </div><div class="mf"><button class="btn pri" onclick="closeModal();decideExit('${id}',true)">אישור היציאה ושיבוץ מחדש של התגבור</button><button class="btn" onclick="closeModal()">לא עכשיו</button></div>`);

function decideExit(id,ok){
  const e=S.exits.find(x=>x.id===id),name=ST(e.sid).name;
  if(ok){ e.madOk={by:ME_N||'מדריך/ה',at:Date.now()};
    if(!e.parOk){ log(`המדריך/ה אישר/ה יציאה של ${name} ב-${fmt(e.date)} — ממתין לאישור הורים`); return commit('אושר ע"י המדריך/ה · ממתין לאישור ההורים'); } }
  exitFinal(e,ok);
}
function parentOkModal(id){
  const e=S.exits.find(x=>x.id===id);

   <p class="muted">יציאה ב-${fmt(e.date)} בין ${hh(e.from)} ל-${hh(e.to)} · ${esc(e.reason)}</p>
   <div class="f2"><div class="fld"><label>איך ההורה אישר/ה?</label><select id="po_how"><option>בשיחת טלפון</option><option>בהודעת וואטסאפ</option><option>בהודעה כתובה / מייל</option><option>פנים אל פנים</option></select></div>

function parentOk(id){
  const e=S.exits.find(x=>x.id===id),name=ST(e.sid).name;
  e.parOk={how:$('#po_how').value,who:$('#po_who').value.trim(),by:ME_N||'',at:Date.now()};closeModal();
  if(!e.madOk){ log(`ההורים של ${name} אישרו יציאה ב-${fmt(e.date)} — ממתין לאישור המדריך/ה`); return commit('אישור ההורים נשמר · ממתין לאישור המדריך/ה'); }

function exitFinal(e,ok){
  const name=ST(e.sid).name;
  e.status=ok?'approved':'rejected';e.decidedBy='מדריך/ה';
  if(ok){
    const tu=exitConflicts(e).filter(c=>c.type==='tutor');
    tu.forEach(c=>{const r=reqAt(c.key,e.sid);r?unassign(r.id):removeFromSession(c.key,e.sid)});
    if(tu.length)notify('coord',`${name} אושר/ה ליציאה ב-${fmt(e.date)} — ${tu.length} תגבורים חזרו לשיבוץ`);
  }
  log(ok?`יציאה של ${name} ב-${fmt(e.date)} אושרה סופית (מדריך/ה + הורים)`:`המדריך/ה דחה/תה יציאה של ${name} ב-${fmt(e.date)}`);
  commit(ok?'היציאה אושרה סופית ✓ (מדריך/ה + הורים)':'הבקשה נדחתה',ok?'ok':'');
}

  const cols=lv.map(l=>{const sids=[...new Set(dem.filter(r=>!l||reqLevel(r)===l).map(r=>r.sid))];const tch=S.teachers.filter(t=>teaches(t,sub,l));

  <div class="alert info"><span>💡</span><div>קבוצה קבועה = אותו מורה, אותה שעה, כל שבוע עד הבגרות. המערכת מציעה רק שעות שבהן <b>כל</b> חברי הקבוצה פנויים בכל השבועות (שיעורים, חוגים, יציאות).</div></div>

  <div class="panel"><h3>קבוצות קבועות פעילות (${S.fixedGroups.length})</h3>${S.fixedGroups.map(g=>{const t=T(g.tid);return `<div class="ses" style="--c:${t?t.color:'#ccc'}"><div class="sp"><b>${esc(subjLabel(g.subject,g.level))}</b> · יום ${DAYS[g.d]} ${hh(g.h)} · ${esc(t?t.name:'—')}<div class="muted">${g.sids.map(i=>esc(ST(i).name)).join(', ')} · ${g.weeks.length} שבועות, עד ${fmt(addDays(g.weeks.at(-1),g.d))}</div></div></div>`}).join('')||'<div class="empty">עדיין אין קבוצות קבועות</div>'}</div>`;
}
function groupSlots(sub,lvl,sids,nW){
  const weeks=Array.from({length:nW},(_,i)=>addDays(weekOf(),7*(i+1))),out=[];
  for(const t of S.teachers){if(!teaches(t,sub,lvl))continue;
    for(const a of t.avail){const [d,h]=a.split('-').map(Number);if(blocked(h)||!sids.length)continue;let ok=sids.length<=t.max;
      for(const w of weeks){if(!ok)break;const s=S.sessions[sk(w,d,h,t.id)];
        if(s&&s.students.length&&(s.subject!==sub||s.students.length+sids.length>t.max)){ok=false;break}
        for(const sid of sids)if(blockers(sid,w,d,h).length||studentBusyAt(sid,w,d,h)){ok=false;break}}
      if(ok)out.push({t,d,h})}}
  return {weeks,out:out.sort((a,b)=>a.d-b.d||a.h-b.h)};
}
function fixedModal(l){
  const lvl=l?+l:null,sub=UI.gs;

  const pool=S.students.filter(s=>!lvl||!LEVELED.includes(sub)||s.levels[sub]===lvl);
  openModal(`<div class="mh"><h3>🧩 קבוצה קבועה · ${esc(subjLabel(sub,lvl))}</h3><span class="sp"></span><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mb">

function createFixed(tid,d,h){

  S.fixedGroups.push({id:gid,subject:g.sub,level:g.lvl,tid,d,h,sids:[...g.sids],weeks:g.weeks});
  const msg=`נפתחה קבוצה קבועה: ${subjLabel(g.sub,g.lvl)}, יום ${DAYS[d]} ${hh(h)} אצל ${T(tid).name} (${g.sids.length} חניכים, ${g.weeks.length} שבועות)`;
  log(msg);notify('coord',msg);closeModal();commit('הקבוצה נפתחה ושובצה לכל השבועות ✓');
}

if(LIVE)liveInit();
else{S=load()||seed();save();render();}
</script>
