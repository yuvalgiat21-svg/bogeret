<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שכבה בוגרת – פורטל ניהולי</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8E033C">
<meta name="apple-mobile-web-app-title" content="בוגרת">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f7; --card: #fff; --card-alt: #f4f7fb; --border: #d7dfea;
  --blue: #1d4ed8; --cyan: #0e7490; --emerald: #047857; --orange: #c2410c;
  --red: #b91c1c; --purple: #6d28d9; --text: #0f1e2e; --text2: #52637a; --text3: #8496ab;
  --shadow: 0 2px 14px rgba(15,30,46,0.08);
  --shadow-lg: 0 10px 34px rgba(15,30,46,0.14);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

.subnav-grid{display:grid!important;gap:7px;}
.subnav-grid button{width:100%;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.subnav button.hl{background:linear-gradient(135deg,#fdf1d6,#fbe3c9);border:1.5px solid #d4a24a;color:#8a5a12;font-weight:800;}
.subnav button.hl.active{background:linear-gradient(135deg,#b45309,#92400e);border-color:#92400e;color:#fff;box-shadow:0 2px 9px rgba(180,83,9,.4);}

/* ═══ SHEET ═══ */
.sheet{background:#fff;border:1px solid #e5e9ee;border-radius:16px;padding:24px 26px;box-shadow:0 2px 18px rgba(15,30,46,.06);}
.sheet-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
 border-bottom:2px solid #0f1e2e;padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;}
.sheet-kick{font-family:'Rubik';font-size:11px;font-weight:600;letter-spacing:.18em;color:#c2410c;margin-bottom:5px;}
.sheet-title{font-family:'Rubik';font-size:27px;font-weight:800;color:#0f1e2e;margin:0;letter-spacing:-.02em;}
.sheet-sub{font-size:12.5px;color:#7a8899;margin-top:5px;}
.sheet-stats{display:flex;gap:26px;}
.sheet-stat{text-align:center;}
.sheet-stat b{display:block;font-family:'Rubik';font-size:30px;font-weight:800;color:#c2410c;line-height:1;}
.sheet-stat span{display:block;font-size:11px;color:#7a8899;margin-top:4px;}
.sheet-lg{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:18px;padding-top:14px;border-top:1px solid #eef1f4;font-size:11.5px;color:#52637a;}
.sheet-lg span{display:inline-flex;align-items:center;gap:6px;}
.sheet-lg i{width:16px;height:11px;border-radius:3px;border:1px solid transparent;display:inline-block;}
.sheet-ft{margin-top:16px;padding-top:11px;border-top:1px solid #eef1f4;font-size:11px;color:#a3aebc;text-align:left;}
.sheet-ft b{color:#52637a;}

/* לוח לילות */
.nt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.nt{border-collapse:separate;border-spacing:2px;font-family:'Heebo';table-layout:fixed;}
.nt th.nt-dl{font-family:'Rubik';font-size:9.5px;font-weight:600;color:#a3aebc;padding:0 0 3px;min-width:40px;width:40px;}
.nt th.nt-m{font-family:'Rubik';font-size:12px;font-weight:800;color:#0f1e2e;text-align:right;
 padding:0 4px 0 10px;white-space:nowrap;position:sticky;right:0;background:#fff;z-index:2;width:86px;min-width:86px;}
.nt td{border-radius:7px;text-align:center;vertical-align:middle;}
.nt td.nt-e{background:transparent;}
.nt td.nt-n{background:var(--bg);border:1px solid var(--bd);color:var(--fg);padding:4px 1px;min-width:40px;width:40px;}
.nt td.nt-n b{display:block;font-family:'Rubik';font-size:11px;font-weight:700;line-height:1;}
.nt td.nt-n span{display:block;font-size:8px;margin-top:2px;line-height:1.2;opacity:.9;}
.nt td.nt-n.sh{border:2px solid #c0392b;}
.nt td.nt-n.first{box-shadow:inset 0 -4px 0 #d81b60;}
.nt td.nt-x{background:#eef1f4;border:1px solid #dde3ea;color:#8494a6;padding:5px;}
.nt td.nt-x b{display:block;font-size:11px;font-weight:700;}
.nt td.nt-x span{display:block;font-size:9.5px;margin-top:1px;direction:ltr;}
.nt-shl{margin-top:12px;font-size:11.5px;color:#52637a;background:#fdf6f4;border:1px solid #f0d5cd;border-radius:9px;padding:8px 12px;}
.nt-shl b{color:#c0392b;}

/* מניין לילות */
.nc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;}
.nc-card{border:1px solid #e5e9ee;border-radius:12px;overflow:hidden;}
.nc-hd{display:flex;justify-content:space-between;align-items:baseline;padding:9px 13px;background:#fafbfc;border-bottom:1px solid #eef1f4;}
.nc-hd b{font-family:'Rubik';font-size:14px;color:#0f1e2e;}
.nc-hd span{font-size:11px;color:#c0392b;font-weight:600;}
.nc-t{width:100%;border-collapse:collapse;font-size:12px;}
.nc-t th{padding:6px 8px;font-size:10.5px;font-weight:600;color:#a3aebc;border-bottom:1px solid #eef1f4;}
.nc-t td{padding:7px 8px;text-align:center;border-bottom:1px solid #f4f6f8;}
.nc-t td.nm{text-align:right;font-weight:700;color:#0f1e2e;}
.nc-t td.tot{font-family:'Rubik';font-weight:800;color:#c2410c;}
.nc-t tr.ha{background:#f2f9fa;} .nc-t tr.hb{background:#fdf7ec;}
.nc-note{margin-top:16px;font-size:12px;color:#52637a;background:#fafbfc;border:1px solid #e5e9ee;border-radius:10px;padding:11px 14px;line-height:1.7;}
.nc-note b{color:#c2410c;}
@media(max-width:768px){ .sheet{padding:16px 14px;} .sheet-title{font-size:20px;} .sheet-stats{gap:16px;} .sheet-stat b{font-size:22px;} }

/* לו"ז רכז */
.luzw{overflow-x:auto;}
.luzt{width:100%;border-collapse:collapse;table-layout:fixed;min-width:820px;}
.luzt th.luz-h{width:66px;}
.luzt th.luz-d{width:calc((100% - 66px)/5);}
.luzt th.luz-d{padding:9px 6px;font-family:'Rubik';font-size:13px;font-weight:700;color:#fff;background:#0f1e2e;
 border:1px solid #0f1e2e;border-radius:0;}
.luzt th.luz-d:first-of-type{border-top-right-radius:9px;} .luzt th.luz-d:last-child{border-top-left-radius:9px;}
.luzt td.luz-t{padding:2px 6px;text-align:center;font-family:'Rubik';font-weight:700;font-size:10.5px;
 color:#a3aebc;background:#fafbfc;border:1px solid #eef1f4;direction:ltr;}
.luzt td.luz-e{border:1px solid #eef1f4;height:22px;}
.luzt td.luz-c{background:var(--bg);color:var(--fg);border:2px solid #fff;border-radius:7px;
 text-align:center;font-size:12px;font-weight:700;padding:4px 5px;line-height:1.35;vertical-align:middle;}
/* עו"סיות */
.soc-card{border:1px solid #e5e9ee;border-top:4px solid var(--c);border-radius:13px;padding:15px 17px;margin-bottom:14px;}
.soc-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.soc-hd b{font-family:'Rubik';font-size:17px;color:var(--c);}
.soc-hd span{font-size:12px;color:#a3aebc;}
.soc-days{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;}
.soc-d{border:1px solid #e5e9ee;border-radius:10px;overflow:hidden;}
.soc-dn{background:#fafbfc;padding:5px;text-align:center;font-family:'Rubik';font-size:11.5px;font-weight:700;color:#7a8899;}
.soc-d input{width:100%;border:none;padding:9px 4px;text-align:center;font-family:'Rubik';font-weight:700;
 font-size:13px;color:#0f1e2e;outline:none;direction:ltr;background:#fff;}
.soc-note{width:100%;margin-top:11px;border:1px solid #e5e9ee;border-radius:9px;padding:7px 11px;
 font-family:'Heebo';font-size:12.5px;}
/* סידורי עבודה */
.sh-wrap{overflow-x:auto;}
.sh{width:100%;border-collapse:separate;border-spacing:0;min-width:740px;}
.sh th.sh-h{padding:10px 12px;text-align:right;font-family:'Rubik';font-size:12.5px;color:#fff;background:#0a1620;
 border-top-right-radius:10px;min-width:180px;}
.sh th.sh-d{padding:10px 6px;font-family:'Rubik';font-size:13px;font-weight:700;color:#fff;background:#0f1e2e;}
.sh th.sh-d:last-child{border-top-left-radius:10px;}
.sh td.sh-t{padding:8px 12px;background:#fff7ed;border-bottom:1px solid #f4e6d5;}
.sh td.sh-t b{display:block;font-family:'Rubik';font-weight:700;font-size:12.5px;color:#c2410c;direction:ltr;text-align:right;}
.sh td.sh-t span{display:block;font-size:10.5px;font-weight:600;color:#a3806a;margin-top:2px;}
.sh td.sh-c{padding:3px;border-bottom:1px solid #eef1f4;background:#fff;}
.sh td.sh-c input{width:100%;min-width:104px;border:1px solid transparent;border-radius:7px;padding:7px 6px;
 font-family:'Heebo';font-size:12.5px;text-align:center;background:transparent;outline:none;color:#0f1e2e;}
.sh td.sh-c input:focus{border-color:#1d4ed8;background:#fff;}
.sh td.sh-c.all{background:#e0ecfd;} .sh td.sh-c.all input{font-weight:800;color:#1e40af;}
.sh td.sh-c.off{background:#fce4e8;} .sh td.sh-c.off input{font-weight:800;color:#9f1239;}
.sh tr.sh-free td.sh-t{background:#fdf1d6;} .sh tr.sh-free td.sh-t b{color:#92400e;}
.sh-notes{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px;}
.sh-n{border:1px solid #e5e9ee;border-right:4px solid var(--c);border-radius:11px;padding:12px 15px;}
.sh-n>b{display:block;font-family:'Rubik';font-size:13px;color:var(--c);margin-bottom:6px;}
.sh-n p{margin:3px 0;font-size:12.5px;color:#52637a;line-height:1.6;}
.sh-n p b{color:#0f1e2e;}
@media(max-width:768px){ .sh-notes{grid-template-columns:1fr;} .soc-days{grid-template-columns:1fr 1fr;} }

/* יומן עו"סיות */
.soccal{display:grid;grid-template-columns:58px repeat(5,1fr);gap:0 6px;margin-bottom:18px;}
.soc-th{padding:8px 4px;text-align:center;font-family:'Rubik';font-size:13px;font-weight:700;
 color:#fff;background:#0f1e2e;border-radius:8px 8px 0 0;}
.soc-th:first-child{background:transparent;}
.soc-times{position:relative;height:420px;}
.soc-tm{position:absolute;left:6px;transform:translateY(-50%);font-family:'Rubik';font-size:10px;
 font-weight:700;color:#a3aebc;direction:ltr;line-height:1;white-space:nowrap;}
.soc-col{position:relative;height:420px;background:#fafbfc;border:1px solid #eef1f4;border-top:none;border-radius:0 0 8px 8px;}
.soc-gl{position:absolute;left:0;right:0;height:1px;background:#eef1f4;}
.socb{position:absolute;background:var(--c);border-radius:8px;color:#fff;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
 box-shadow:0 2px 8px rgba(15,30,46,.18);overflow:hidden;padding:3px 2px;}
.socb b{font-family:'Rubik';font-size:11.5px;font-weight:800;line-height:1;}
.socb span{font-family:'Rubik';font-size:9.5px;font-weight:600;opacity:.92;direction:ltr;line-height:1.2;}
.socb span.to{opacity:.75;}
.soc-edt{font-family:'Rubik';font-size:12.5px;font-weight:700;color:#a3aebc;margin:6px 0 8px;}
.soc-ed{width:100%;border-collapse:collapse;font-size:12.5px;}
.soc-ed th{padding:7px 6px;font-size:11px;font-weight:600;color:#a3aebc;border-bottom:1px solid #eef1f4;}
.soc-ed td{padding:5px 4px;border-bottom:1px solid #f4f6f8;text-align:center;}
.soc-ed td.nm{text-align:right;min-width:118px;}
.soc-ed td.nm b{display:block;font-family:'Rubik';font-size:13px;}
.soc-ed td.nm span{display:block;font-size:10.5px;color:#a3aebc;}
.soc-ed td input{width:100%;min-width:96px;border:1px solid #e5e9ee;border-radius:7px;padding:5px 4px;
 text-align:center;font-family:'Rubik';font-weight:700;font-size:12px;direction:ltr;}
.soc-ed td.tot{font-family:'Rubik';font-weight:800;color:#c2410c;}
.soc-nt{margin-top:9px;font-size:12.5px;color:#52637a;background:#fafbfc;border-right:4px solid var(--c);
 border-radius:8px;padding:8px 12px;}
.soc-nt b{color:var(--c);}
@media(max-width:768px){ .soccal{grid-template-columns:44px repeat(5,1fr);gap:0 3px;}
 .soc-col,.soc-times{height:300px;} .socb b{font-size:9.5px;} .socb span{font-size:8px;} }

/* שכבת יא' */
.ya-hero{background:linear-gradient(135deg,#0f1e2e,#1f3a52);color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:16px;}
.ya-hero-t{font-family:'Rubik';font-size:18px;font-weight:700;line-height:1.55;}
.ya-hero-s{font-size:14px;color:#a8cbe0;margin-top:10px;font-style:italic;line-height:1.6;}
.ya-grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px;}
.ya-box{background:#fff;border:1px solid #e5e9ee;border-right:5px solid var(--c);border-radius:12px;padding:13px 16px;}
.ya-box>b{display:block;font-family:'Rubik';font-size:13px;color:var(--c);margin-bottom:6px;}
.ya-box p{margin:4px 0;font-size:12.5px;color:#52637a;line-height:1.65;}
.ya-sec{font-family:'Rubik';font-size:15px;font-weight:800;color:#0f1e2e;margin:20px 0 10px;
 padding-bottom:6px;border-bottom:2px solid #eef1f4;}
.ya-lv{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px;}
.ya-lv i{width:9px;height:13px;border-radius:2px;display:inline-block;}
.ya-signs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.ya-sign{display:flex;gap:11px;background:#fff;border:1px solid #e5e9ee;border-radius:11px;padding:11px 13px;}
.ya-sign .num{font-family:'Rubik';font-size:16px;font-weight:800;color:#dde3ea;line-height:1;}
.ya-sign b{display:block;font-size:12.5px;color:#0f1e2e;line-height:1.45;}
.ya-sign p{margin:5px 0 0;font-size:11.5px;color:#7a8899;line-height:1.5;}
.ya-cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;}
.ya-cc{background:#fff;border:1px solid #e5e9ee;border-top:3px solid #c2410c;border-radius:11px;padding:12px 14px;}
.ya-cc b{display:block;font-family:'Rubik';font-size:13px;color:#c2410c;margin-bottom:5px;}
.ya-cc p{margin:0;font-size:12px;color:#52637a;line-height:1.6;}
.ya-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:8px;}
.ya-cat{background:#fff;border:1px solid #e5e9ee;border-top:4px solid var(--c);border-radius:12px;padding:14px 16px;position:relative;}
.ya-cat .n{position:absolute;top:12px;left:14px;font-family:'Rubik';font-size:15px;font-weight:800;color:#eef1f4;}
.ya-cat b{display:block;font-family:'Rubik';font-size:15px;color:var(--c);margin-bottom:6px;}
.ya-cat p{margin:0;font-size:12.5px;color:#52637a;line-height:1.6;}
.ya-qs{display:flex;flex-direction:column;gap:6px;}
.ya-q{display:flex;gap:10px;align-items:baseline;background:#fff;border:1px solid #e5e9ee;border-radius:9px;padding:8px 12px;font-size:12.5px;color:#0f1e2e;}
.ya-q span{font-family:'Rubik';font-weight:800;color:#c2410c;font-size:11px;}
.ya-ax{background:#fff;border:1px solid #e5e9ee;border-right:5px solid var(--c);border-radius:11px;padding:11px 14px;margin-bottom:8px;}
.ya-ax b{display:block;font-family:'Rubik';font-size:13px;color:var(--c);}
.ya-ax p{margin:4px 0;font-size:11.5px;color:#7a8899;line-height:1.55;}
.ya-ax span{display:inline-block;font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:99px;padding:2px 10px;}
.ya-edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:11px;}
.ya-ec{background:#fafbfc;border:1px solid #e5e9ee;border-radius:11px;padding:12px 14px;}
.ya-et{font-family:'Rubik';font-size:13.5px;font-weight:700;color:#1d4ed8;margin-bottom:6px;line-height:1.4;}
.ya-eg{font-size:12px;color:#52637a;line-height:1.6;margin-bottom:6px;}
.ya-em{font-size:11.5px;color:#7a8899;line-height:1.65;background:#fff;border-radius:8px;padding:7px 10px;}
.ya-eo{font-size:11.5px;font-weight:700;color:#047857;margin-top:7px;}
.yaf{background:#fff;border:1px solid #e5e9ee;border-right:5px solid #1d4ed8;border-radius:13px;padding:14px;}
.yaf-h{display:flex;align-items:center;gap:11px;}
.yaf-ic{width:46px;height:46px;border-radius:12px;background:rgba(29,78,216,.1);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.yaf-t{width:100%;border:none;border-bottom:1px solid #e5e9ee;font-family:'Rubik';font-weight:700;font-size:14px;padding:2px 0;outline:none;}
.yaf-d{width:100%;border:none;font-size:11.5px;color:#7a8899;padding:2px 0;outline:none;margin-top:2px;}
.yaf-u{flex:1;border:1px solid #e5e9ee;border-radius:7px;padding:5px 9px;font-family:'Heebo';font-size:11.5px;direction:ltr;text-align:left;}
@media(max-width:768px){ .ya-grid2,.ya-signs{grid-template-columns:1fr;} .ya-hero-t{font-size:15px;} }

/* LEADERSHIP BODIES */
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;}
.lb-c{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;
 display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(15,30,46,.05);transition:transform .15s;}
.lb-c:hover{transform:translateY(-2px);box-shadow:var(--shadow);}

/* ROOMS */
.rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;}
.rm{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.rm .hd{padding:7px 11px;font-family:'Rubik';font-weight:700;font-size:12.5px;color:#fff;display:flex;justify-content:space-between;align-items:center;}
.rm .bd{padding:8px 11px 10px;}
.rm .mb{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px;border-bottom:1px solid #f1f5f9;}
.rm .mb:last-child{border-bottom:none;}
.rm .gd{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.rm .cap{font-size:11px;opacity:.85;font-weight:600;}
.rm .qm{color:#b45309;font-weight:700;}

/* SUB-TABS */
.subnav{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);
 border-radius:14px;padding:8px;margin-bottom:16px;box-shadow:var(--shadow);}
.subnav button{flex:1;min-width:150px;padding:11px 14px;border:none;border-radius:10px;background:transparent;
 font-family:'Heebo';font-size:13.5px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .18s;}
.subnav button:hover{background:var(--card-alt);color:var(--text);}
.subnav button.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3);}
.subsec{display:none;} .subsec.active{display:block;}

/* EVENTS TABLE */
.evt{width:100%;border-collapse:separate;border-spacing:0 4px;}
.evt th{font-family:'Rubik';font-size:12.5px;font-weight:700;color:#fff;background:var(--text);
 padding:10px 12px;text-align:right;}
.evt th:first-child{border-radius:0 10px 10px 0;} .evt th:last-child{border-radius:10px 0 0 10px;}
.evt td{background:#fff;padding:9px 12px;font-size:13px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.evt td:first-child{border-right:1px solid var(--border);border-radius:0 9px 9px 0;font-weight:700;color:var(--text2);
 white-space:nowrap;font-size:12.5px;}
.evt td:last-child{border-left:1px solid var(--border);border-radius:9px 0 0 9px;}
.evt tr.k-shabbat td{background:#e0ecfd;} .evt tr.k-shabbat td:first-child{border-right:5px solid #1d4ed8;}
.evt tr.k-holiday td{background:#dcf5e4;} .evt tr.k-holiday td:first-child{border-right:5px solid #15803d;}
.evt tr.k-bogeret td{background:#fce4e8;} .evt tr.k-bogeret td:first-child{border-right:5px solid #be123c;}
.evt tr.k-milestone td{background:#fdf1d6;} .evt tr.k-milestone td:first-child{border-right:5px solid #b45309;}
.evt tr.k-event td:first-child{border-right:5px solid #0e7490;}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;
 background:var(--card-alt);color:var(--text2);border:1px solid var(--border);}
.lg-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px;font-size:12px;color:var(--text2);}
.lg-row span{display:flex;gap:6px;align-items:center;}
.lg-row i{width:14px;height:14px;border-radius:4px;display:block;}

/* NAAT */
.naat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px;}
.naat-c{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:12px 13px;
 display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(15,30,46,.05);transition:transform .15s;}
.naat-c:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.naat-ring{width:50px;height:50px;border-radius:50%;border:2.5px solid;flex-shrink:0;
 display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;}
.naat-t{flex:1;min-width:0;}
.naat-c .r{font-family:'Rubik';font-size:13.5px;font-weight:700;line-height:1.25;}
.naat-c .p{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;}
.naat-p{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid;}
.naat-p i{font-style:normal;font-weight:500;opacity:.8;font-size:10.5px;margin-right:5px;padding-right:5px;border-right:1px solid currentColor;}

/* LUZ RAKAZ */
.luz-wrap{overflow-x:auto;}
table.luz{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:820px;}
table.luz th,table.luz td{border-bottom:1px solid var(--border);border-left:1px solid var(--border);padding:0;text-align:center;vertical-align:middle;height:44px;}
table.luz td:first-child,table.luz th:first-child{border-left:none;}
table.luz thead th{font-family:'Rubik';font-weight:700;font-size:15px;color:#fff;background:var(--text);padding:11px 0;border-bottom:none;border-left:1px solid rgba(255,255,255,.15);}
table.luz thead th:first-child{background:var(--text2);width:70px;}
table.luz thead th:last-child{border-left:none;}
table.luz .tc{font-family:'Heebo';font-weight:600;font-size:12px;color:var(--text3);background:var(--card-alt);direction:ltr;}
.lz{border-radius:6px;margin:2px 3px;padding:6px 5px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;}
.lz .t{font-family:'Heebo';font-weight:700;font-size:13px;}
.lz .s{font-size:11px;opacity:.8;margin-top:2px;direction:ltr;}
.z-hist{background:#fbe3c9;color:#92400e;border-right:3px solid #d97706;}
.z-team{background:#c9e6fb;color:#075985;border-right:3px solid #0891b2;}
.z-meet{background:#fcf19a;color:#854d0e;border-right:3px solid #ca8a04;}
.z-pers{background:#fbcfcf;color:#9a3412;border-right:3px solid #ea580c;}
.z-act{background:#e6d4fb;color:#6b21a8;border-right:3px solid #7c3aed;}
.z-meal{background:#bff2d1;color:#166534;border-right:3px solid #16a34a;}
.z-free{background:#f1f5f9;color:#475569;border-right:3px solid #94a3b8;}
.z-sport{background:#f9cfe4;color:#9d174d;border-right:3px solid #db2777;}
.z-lead{background:#fbcaca;color:#991b1b;border-right:3px solid #dc2626;}
.z-open{position:relative;background:#fffbeb;color:#92400e;border:2px dashed #d97706;border-right:5px solid #b45309;}
.z-open .t{font-weight:800;}
.z-open .bd{position:absolute;top:2px;left:4px;font-family:'Heebo';font-weight:800;font-size:10px;color:#fff;background:#d97706;border-radius:99px;padding:0 6px;}
.luz-lg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--text2);}
.luz-lg span{display:flex;gap:6px;align-items:center;}
.luz-lg i{width:16px;height:16px;border-radius:4px;display:block;}

/* LOGIN */
#loginScreen { position:fixed; inset:0; background:linear-gradient(135deg,#7a1f3a,#a13447 60%,#d2683d); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; padding:20px; }
#loginScreen .login-box { background:#fff; padding:36px 32px; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.3); max-width:400px; width:100%; text-align:center; }
#loginScreen img { height:80px; margin-bottom:20px; }
#loginScreen h2 { color:var(--text); font-family:'Rubik'; margin-bottom:8px; font-size:22px; font-weight:700; }
#loginScreen p { color:var(--text2); font-size:13px; margin-bottom:24px; }
#loginScreen input { width:100%; padding:14px 18px; border-radius:12px; border:2px solid var(--border); background:var(--card-alt); font-size:16px; text-align:center; font-family:'Heebo'; outline:none; transition:border-color .2s; }
#loginScreen input:focus { border-color:var(--blue); background:#fff; }
#loginScreen button { margin-top:14px; width:100%; padding:14px; border-radius:12px; border:none; background:linear-gradient(135deg,#a13447,#d2683d); color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:'Heebo'; transition:transform .15s; }
#loginScreen button:hover { transform:translateY(-1px); }
#loginScreen .error { color:var(--red); margin-top:10px; font-size:13px; display:none; }

/* HEADER */
.header { background:#fff; border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:var(--shadow); }
.header-right { display:flex; align-items:center; gap:14px; }
.header-right img { height:44px; }
.header-title h1 { font-family:'Rubik'; font-size:19px; font-weight:700; color:var(--text); }
.header-title span { font-size:12px; color:var(--text2); }
.header-date { font-size:12px; color:var(--text2); background:var(--card-alt); padding:6px 14px; border-radius:8px; border:1px solid var(--border); }

/* NAV */
.nav { display:flex; gap:3px; padding:10px 20px; background:#fff; border-bottom:1px solid var(--border); overflow-x:auto; flex-wrap:wrap; }
.nav button { padding:8px 14px; border-radius:8px; font-size:13px; font-weight:500; color:var(--text2); cursor:pointer; border:none; background:none; font-family:'Heebo'; white-space:nowrap; transition:all .15s; }
.nav button:hover { color:var(--text); background:var(--card-alt); }
.nav button.active { color:#fff; background:var(--blue); border:1px solid var(--blue); font-weight:700; box-shadow:0 2px 8px rgba(29,78,216,.35); }

/* MAIN */
.main { padding:20px 24px; max-width:1500px; margin:0 auto; }
.sec { display:none; }
.sec.active { display:block; animation:fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* CARDS */
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
.card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:18px 18px 18px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:transform .2s; }
/* פס צבע לכרטיסי מדד לפי צבע המספר */
.card:has(.val[style*="--blue"])    { border-right:5px solid var(--blue);    background:linear-gradient(135deg,rgba(29,78,216,.07),#fff 62%); }
.card:has(.val[style*="--cyan"])    { border-right:5px solid var(--cyan);    background:linear-gradient(135deg,rgba(14,116,144,.07),#fff 62%); }
.card:has(.val[style*="--purple"])  { border-right:5px solid var(--purple);  background:linear-gradient(135deg,rgba(109,40,217,.07),#fff 62%); }
.card:has(.val[style*="--emerald"]) { border-right:5px solid var(--emerald); background:linear-gradient(135deg,rgba(4,120,87,.07),#fff 62%); }
.card:has(.val[style*="--orange"])  { border-right:5px solid var(--orange);  background:linear-gradient(135deg,rgba(194,65,12,.07),#fff 62%); }
.card:has(.val[style*="--red"])     { border-right:5px solid var(--red);     background:linear-gradient(135deg,rgba(185,28,28,.07),#fff 62%); }
.card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); }
.card:hover { transform:translateY(-2px); }
.card .icon { font-size:24px; margin-bottom:6px; }
.card .val { font-family:'Rubik'; font-size:32px; font-weight:800; line-height:1; letter-spacing:-.02em; }
.card .lbl { font-size:12.5px; color:var(--text2); margin-top:5px; font-weight:600; }

/* PANELS */
.panel { background:#fff; border:1px solid var(--border); border-radius:14px; margin-bottom:18px; box-shadow:var(--shadow); overflow:hidden; }
.panel-h { padding:14px 20px; background:linear-gradient(180deg,#fafcfe,#f4f7fb); border-bottom:2px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.panel-h h2 { font-family:'Rubik'; font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
.panel-b { padding:16px 20px; }

/* SEARCH */
.search { width:100%; padding:10px 16px; border-radius:10px; border:1px solid var(--border); font-size:14px; font-family:'Heebo'; margin-bottom:12px; outline:none; }
.search:focus { border-color:var(--blue); }

/* TABLES */
.tbl { width:100%; border-collapse:separate; border-spacing:0 3px; }
.tbl th { background:#f1f5f9; padding:10px 8px; font-size:12px; font-weight:600; color:var(--blue); text-align:right; border-radius:6px; }
.tbl td { background:#fafbfc; padding:8px 10px; font-size:12px; border-radius:4px; }
.tbl tr:hover td { background:#f0f7ff; }

/* TAGS */
.tag { display:inline-block; padding:3px 11px; border-radius:20px; font-size:11.5px; font-weight:700; }
.tag-green { background:rgba(5,150,105,0.14); border:1px solid rgba(5,150,105,0.3); color:var(--emerald); }
.tag-orange { background:rgba(194,65,12,0.15); border:1px solid rgba(194,65,12,.35); color:#9a3412; }
.tag-red { background:rgba(185,28,28,0.15); border:1px solid rgba(185,28,28,.35); color:#991b1b; }
.tag-blue { background:rgba(29,78,216,0.15); border:1px solid rgba(29,78,216,.35); color:#1e40af; }
.tag-purple { background:rgba(109,40,217,0.15); border:1px solid rgba(109,40,217,.35); color:#5b21b6; }

/* RAMZOR */
.ramzor-month { background:var(--card-alt); border-radius:10px; padding:14px; margin-bottom:12px; border:1px solid var(--border); }
.ramzor-month-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.ramzor-month-h h3 { font-size:15px; font-weight:600; color:var(--blue); }
.ramzor-counts { display:flex; gap:12px; font-size:13px; }
.ramzor-counts span { display:flex; align-items:center; gap:4px; }
.ramzor-list { display:flex; flex-wrap:wrap; gap:6px; }
.ramzor-name { padding:4px 10px; border-radius:14px; font-size:12px; font-weight:500; }
.ramzor-red { background:var(--red); color:#fff; }
.ramzor-orange { background:var(--orange); color:#fff; }

/* STAFF */
.staff-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
.staff-c { background:var(--card-alt); border:1px solid var(--border); border-radius:12px; padding:16px; transition:all .2s;  border-top:3px solid var(--blue); }
.staff-c:hover { border-color:var(--blue); box-shadow:var(--shadow); transform:translateY(-2px); }
.staff-av { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--cyan)); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:#fff; margin-bottom:10px; }
.staff-c h3 { font-size:14px; font-weight:600; }
.staff-c .role { font-size:12px; color:var(--blue); margin-top:2px; }
.staff-c .extra { font-size:11px; color:var(--text2); margin-top:3px; }

/* SCHEDULE */
.sch-tbl { width:100%; border-collapse:separate; border-spacing:2px; }
.sch-tbl th { background:#f1f5f9; padding:10px 6px; font-size:12px; font-weight:600; color:var(--blue); border-radius:6px; text-align:center; }
.sch-tbl td { background:#fafbfc; padding:8px 6px; font-size:11px; text-align:center; border-radius:5px; line-height:1.4; }
.sch-tbl .time { font-weight:600; color:var(--orange); text-align:right; padding-right:10px; background:#fff7ed; }
.sch-tbl .time .hr { display:block; font-family:'Rubik'; font-weight:700; font-size:12.5px; color:var(--orange); direction:ltr; text-align:right; }
.sch-tbl .time .sh { display:block; font-size:11px; font-weight:600; color:var(--text2); margin-top:2px; line-height:1.35; }
.sch-tbl { table-layout:fixed; }
.sch-tbl .time { width:210px; }
.sch-tbl th:first-child { width:210px; }
.sch-tbl td { min-height:38px; }


/* GANTT */
.gantt-row { display:flex; align-items:stretch; margin-bottom:5px; gap:6px; position:relative; }
.gantt-row:first-of-type ~ .gantt-row:nth-of-type(2) .gantt-tt { bottom:auto; top:calc(100% + 9px); }
.gantt-row:nth-of-type(2) .gantt-tt::after { top:auto; bottom:100%; border-top-color:transparent; border-bottom-color:#fff; }
.gantt-ml { min-width:74px; font-family:'Rubik'; font-size:13px; font-weight:700; color:var(--text);
  display:flex; align-items:center; }
.gantt-days { display:flex; gap:7px; flex:1; overflow:visible; padding-bottom:2px; }
.gw { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; flex:1; min-width:132px;
  background:#f4f7fb; border:1px solid #d7dfea; border-radius:9px; padding:3px; }
.gw.hdr { background:var(--text); border-color:var(--text); }
.gw.hdr .gd-h { color:#fff; font-family:'Rubik'; font-weight:700; font-size:11.5px;
  height:20px; display:flex; align-items:center; justify-content:center; }
.gw.hdr .gd-h.sat { color:#93c5fd; }
.gantt-d { height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-family:'Rubik'; font-size:11.5px; font-weight:600; color:#8496ab; background:#e6ecf4;
  position:relative; transition:transform .12s, box-shadow .12s; }
.gantt-d.pad { background:transparent; }
.gantt-d.sat { background:#dde6f2; }
.gantt-d.has-ev { color:#fff; font-weight:800; cursor:pointer; box-shadow:0 1px 4px rgba(15,30,46,.18); }
.gantt-d.has-ev:hover { transform:translateY(-2px) scale(1.12); box-shadow:0 6px 16px rgba(15,30,46,.35); z-index:20; }
.gantt-d.multi::after { content:''; position:absolute; top:3px; left:4px; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.9); }
.gantt-tt { display:none; position:absolute; bottom:calc(100% + 9px); right:50%; transform:translateX(50%);
  background:#fff; border:1px solid var(--border); border-radius:12px; padding:0; overflow:hidden;
  font-family:'Heebo'; z-index:80; box-shadow:0 14px 42px rgba(15,30,46,.35); width:265px; text-align:right; }
.gantt-tt .tt-h { background:#0f1e2e; color:#fff; font-family:'Rubik'; font-weight:700; font-size:12px; padding:7px 12px; }
.tt-ev { padding:9px 12px; border-bottom:1px solid #eef2f7; background:#fff; }
.tt-ev:last-child { border-bottom:none; }
.tt-t { font-weight:800; font-size:13px; color:var(--text); line-height:1.3; }
.tt-k { font-size:11px; font-weight:700; margin-top:2px; }
.tt-r { font-size:11.5px; color:var(--text2); margin-top:4px; }
.tt-r b { color:var(--text); }
.gantt-d:hover .gantt-tt { display:block; }
.gantt-tt::after { content:''; position:absolute; top:100%; right:50%; transform:translateX(50%);
  border:7px solid transparent; border-top-color:#fff; filter:drop-shadow(0 2px 2px rgba(15,30,46,.2)); }
.gantt-d:hover .gantt-tt { display:block; }

.subnav-grid{display:grid!important;gap:7px;}
.subnav-grid button{width:100%;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.subnav button.hl{background:linear-gradient(135deg,#fdf1d6,#fbe3c9);border:1.5px solid #d4a24a;color:#8a5a12;font-weight:800;}
.subnav button.hl.active{background:linear-gradient(135deg,#b45309,#92400e);border-color:#92400e;color:#fff;box-shadow:0 2px 9px rgba(180,83,9,.4);}

/* ═══ SHEET ═══ */
.sheet{background:#fff;border:1px solid #e5e9ee;border-radius:16px;padding:24px 26px;box-shadow:0 2px 18px rgba(15,30,46,.06);}
.sheet-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
 border-bottom:2px solid #0f1e2e;padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;}
.sheet-kick{font-family:'Rubik';font-size:11px;font-weight:600;letter-spacing:.18em;color:#c2410c;margin-bottom:5px;}
.sheet-title{font-family:'Rubik';font-size:27px;font-weight:800;color:#0f1e2e;margin:0;letter-spacing:-.02em;}
.sheet-sub{font-size:12.5px;color:#7a8899;margin-top:5px;}
.sheet-stats{display:flex;gap:26px;}
.sheet-stat{text-align:center;}
.sheet-stat b{display:block;font-family:'Rubik';font-size:30px;font-weight:800;color:#c2410c;line-height:1;}
.sheet-stat span{display:block;font-size:11px;color:#7a8899;margin-top:4px;}
.sheet-lg{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:18px;padding-top:14px;border-top:1px solid #eef1f4;font-size:11.5px;color:#52637a;}
.sheet-lg span{display:inline-flex;align-items:center;gap:6px;}
.sheet-lg i{width:16px;height:11px;border-radius:3px;border:1px solid transparent;display:inline-block;}
.sheet-ft{margin-top:16px;padding-top:11px;border-top:1px solid #eef1f4;font-size:11px;color:#a3aebc;text-align:left;}
.sheet-ft b{color:#52637a;}

/* לוח לילות */
.nt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.nt{border-collapse:separate;border-spacing:2px;font-family:'Heebo';table-layout:fixed;}
.nt th.nt-dl{font-family:'Rubik';font-size:9.5px;font-weight:600;color:#a3aebc;padding:0 0 3px;min-width:40px;width:40px;}
.nt th.nt-m{font-family:'Rubik';font-size:12px;font-weight:800;color:#0f1e2e;text-align:right;
 padding:0 4px 0 10px;white-space:nowrap;position:sticky;right:0;background:#fff;z-index:2;width:86px;min-width:86px;}
.nt td{border-radius:7px;text-align:center;vertical-align:middle;}
.nt td.nt-e{background:transparent;}
.nt td.nt-n{background:var(--bg);border:1px solid var(--bd);color:var(--fg);padding:4px 1px;min-width:40px;width:40px;}
.nt td.nt-n b{display:block;font-family:'Rubik';font-size:11px;font-weight:700;line-height:1;}
.nt td.nt-n span{display:block;font-size:8px;margin-top:2px;line-height:1.2;opacity:.9;}
.nt td.nt-n.sh{border:2px solid #c0392b;}
.nt td.nt-n.first{box-shadow:inset 0 -4px 0 #d81b60;}
.nt td.nt-x{background:#eef1f4;border:1px solid #dde3ea;color:#8494a6;padding:5px;}
.nt td.nt-x b{display:block;font-size:11px;font-weight:700;}
.nt td.nt-x span{display:block;font-size:9.5px;margin-top:1px;direction:ltr;}
.nt-shl{margin-top:12px;font-size:11.5px;color:#52637a;background:#fdf6f4;border:1px solid #f0d5cd;border-radius:9px;padding:8px 12px;}
.nt-shl b{color:#c0392b;}

/* מניין לילות */
.nc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;}
.nc-card{border:1px solid #e5e9ee;border-radius:12px;overflow:hidden;}
.nc-hd{display:flex;justify-content:space-between;align-items:baseline;padding:9px 13px;background:#fafbfc;border-bottom:1px solid #eef1f4;}
.nc-hd b{font-family:'Rubik';font-size:14px;color:#0f1e2e;}
.nc-hd span{font-size:11px;color:#c0392b;font-weight:600;}
.nc-t{width:100%;border-collapse:collapse;font-size:12px;}
.nc-t th{padding:6px 8px;font-size:10.5px;font-weight:600;color:#a3aebc;border-bottom:1px solid #eef1f4;}
.nc-t td{padding:7px 8px;text-align:center;border-bottom:1px solid #f4f6f8;}
.nc-t td.nm{text-align:right;font-weight:700;color:#0f1e2e;}
.nc-t td.tot{font-family:'Rubik';font-weight:800;color:#c2410c;}
.nc-t tr.ha{background:#f2f9fa;} .nc-t tr.hb{background:#fdf7ec;}
.nc-note{margin-top:16px;font-size:12px;color:#52637a;background:#fafbfc;border:1px solid #e5e9ee;border-radius:10px;padding:11px 14px;line-height:1.7;}

async function sha(s){
  const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

var FBAUTH=null, FBUSER=null;
async function fbInit(){
  const appMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const authMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
  const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(FB_CONFIG);
  FBAUTH = { m: authMod, a: authMod.getAuth(app) };
  await authMod.setPersistence(FBAUTH.a, authMod.browserLocalPersistence).catch(()=>{});
  return FBAUTH;
}
function normEmail(e){ return (e||'').trim().toLowerCase(); }
function userByEmail(e){ const x=normEmail(e); return USERS.find(u => normEmail(u.email)===x || normEmail(u.alt)===x); }

async function fbSignInEmail(){
  const err=document.getElementById('loginError');
  const em=(document.getElementById('fbEmail').value||'').trim();
  const pw=document.getElementById('fbPass').value;
  err.style.display='none';
  if(!em || !pw){ err.textContent='הזן כתובת מייל וסיסמה'; err.style.display='block'; return; }
  const u=userByEmail(em);
  if(!u){ err.textContent=`הכתובת ${em} אינה מורשית לפורטל`; err.style.display='block'; return; }
  if(pw.length<6){ err.textContent='הסיסמה חייבת להיות באורך 6 תווים לפחות'; err.style.display='block'; return; }
  try{
    if(!FBAUTH) await fbInit();
    let res;
    try{
      res = await FBAUTH.m.signInWithEmailAndPassword(FBAUTH.a, em, pw);
    }catch(e1){
      if(/user-not-found|invalid-credential/.test(e1.code||'')){
        // כניסה ראשונה — יצירת חשבון אוטומטית
        try{
          res = await FBAUTH.m.createUserWithEmailAndPassword(FBAUTH.a, em, pw);
        }catch(e2){
          if((e2.code||'')==='auth/email-already-in-use'){
            err.textContent='הסיסמה שגויה. אם שכחת — פנה ליובל לאיפוס.'; err.style.display='block'; return;
          }
          throw e2;
        }
      } else throw e1;
    }
    await afterFbAuth(res.user);
  }catch(e){
    const c=e.code||'';
    err.textContent =
      /wrong-password|invalid-credential/.test(c) ? 'סיסמה שגויה' :
      c==='auth/too-many-requests' ? 'יותר מדי ניסיונות — נסה שוב בעוד כמה דקות' :
      c==='auth/operation-not-allowed' ? 'התחברות במייל אינה מופעלת ב-Firebase' :
      c==='auth/unauthorized-domain' ? 'הכתובת הזו לא מאושרת ב-Firebase' :
      c==='auth/invalid-email' ? 'כתובת המייל אינה תקינה' :
      c==='auth/weak-password' ? 'הסיסמה חלשה מדי' :
      'ההתחברות נכשלה: '+(c||e.message);
    err.style.display='block';
  }
}

function applyPerms(){
  if(!ME || ME.mode==='admin') return;
  const allowed=SCOPE_GROUPS[ME.scope];

  // הסתרת קבוצות מחוץ לתחום
  const gn=document.getElementById('grSubnav');
  if(gn && allowed){
    gn.querySelectorAll('button').forEach(b=>{ if(!allowed.includes(b.dataset.k)) b.remove(); });
    const first=gn.querySelector('button');
    if(first){ first.click(); }
  }
  // לשוניות ראשיות שאינן רלוונטיות
  ['graduates','prof'].forEach(k=>{
    const b=document.getElementById('tab-'+k); if(b && ME.mode==='view') b.remove();
  });
  if(ME.mode==='view'){
    lockInputs();
    const obs=new MutationObserver(()=>lockInputs());
    obs.observe(document.getElementById('mainContent'),{childList:true,subtree:true});
  }
}
function lockInputs(){
  const m=document.getElementById('mainContent'); if(!m) return;
  const allow=(window.ME && ME.canEdit) || [];
  const open = el => allow.some(k=>{ try{ return !!el.closest('[id$="-'+k+'"]'); }catch(x){ return false; } });
  m.querySelectorAll('input,select,textarea').forEach(el=>{
    if(open(el)){
      if(el.dataset.locked){ delete el.dataset.locked; el.disabled=false; el.style.background=''; el.style.cursor=''; }
      return;
    }
    if(el.dataset.locked) return;
    el.dataset.locked='1'; el.disabled=true; el.style.background='#f4f7fb'; el.style.cursor='not-allowed';
  });
  m.querySelectorAll('button').forEach(b=>{
    if(open(b) || b.dataset.locked) return;
    if(/הוסף|מחק|אפס|שחזר|צור|רענן|מפתח/.test(b.textContent||'')){ b.dataset.locked='1'; b.remove(); }
  });
}

function _fill(t,v){
  if(Array.isArray(t)){ t.length=0; (v||[]).forEach(x=>t.push(x)); }

}
async function secureDb(){

  if(!FBAUTH.a.currentUser) throw new Error('לא מחובר');

  const dbm=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
  return {dbm, rdb: dbm.getDatabase(appMod.getApp())};
}

  _fill(SEED_AFT, P('SEED_AFT'));
  _fill(SEED_MED, P('SEED_MED'));
  _fill(SEED_DIET, P('SEED_DIET'));
  _fill(SEED_PK, P('SEED_PK'));
  _fill(BUSES_EVAC, P('BUSES_EVAC'));
  _fill(ACADEMY_ROOMS, P('ACADEMY_ROOMS'));
  _fill(D, P('DATA_JSON'));

function mkNav(id, items, onPick, opts){
  opts=opts||{};
  const n=document.createElement('div'); n.className='subnav'+(opts.grid?' subnav-grid':''); n.id=id+'Subnav';
  if(opts.grid){
    const cols=Math.ceil(items.length/2);
    n.style.gridTemplateColumns='repeat('+cols+',1fr)';
  }
  n.innerHTML = items.map((it,i)=>`<button class="${i===0?'active':''}${it.hl?' hl':''}" data-k="${it.k}">${it.label}</button>`).join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    n.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); onPick(b.dataset.k);
  });
  return n;
}

  const ttl=prompt('כותרת:'); if(!ttl) return;

function knWire(scope){
  const nav=document.getElementById('kn'+scope+'Subnav'); if(!nav) return;
  const wrap=document.getElementById('knwrap-'+scope);
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    wrap.querySelectorAll(':scope > .subsec').forEach(s=>s.classList.remove('active'));

    <div class="card" style="border-right:6px solid #b91c1c;"><div class="icon">🔴</div><div class="val" style="color:#b91c1c">${s.miss}</div><div class="lbl">לא בוצעו</div></div>

        return `<tr style="border-bottom:1px solid #eef2f7;">
          ${wk===1?`<td rowspan="4" style="padding:6px 11px;font-weight:700;font-size:12.5px;vertical-align:top;border-right:5px solid ${c};min-width:180px;">${x.topic}<div style="font-size:10.5px;color:var(--text3);font-weight:400;margin-top:2px;">${x.category||''}</div></td>`:''}

          <td style="padding:3px 4px;"><select onchange="eduSet('${scope}','${x.id}',${wk},'status',this.value)" style="width:104px;border:1px solid var(--border);border-radius:5px;padding:3px 5px;font-family:'Heebo';font-size:11px;font-weight:700;color:${EDU_STC[e.status||'']};">
            ${EDU_ST.map(o=>`<option value="${o}" ${o===(e.status||'')?'selected':''}>${o||'—'}</option>`).join('')}</select></td>
          <td style="padding:3px 4px;"><input value="${(e.exec||'').replace(/"/g,'&quot;')}" oninput="eduSet('${scope}','${x.id}',${wk},'exec',this.value)" placeholder="מה בוצע בפועל…" style="width:100%;min-width:150px;border:1px solid var(--border);border-radius:5px;padding:3px 7px;font-family:'Heebo';font-size:11.5px;"></td>
          <td style="padding:3px 4px;"><input type="date" value="${e.date||''}" onchange="eduSet('${scope}','${x.id}',${wk},'date',this.value)" style="width:102px;border:1px solid var(--border);border-radius:5px;padding:3px 5px;font-family:'Heebo';font-size:10.5px;"></td>
        </tr>`;}).join('')).join('');
  }).filter(Boolean).join('');
  return cards + `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">
    <thead><tr style="background:var(--text);color:#fff;">
      <th style="padding:8px 11px;text-align:right;">נושא</th><th style="padding:8px 6px;">שבוע</th>
      <th style="padding:8px 6px;">תכנון</th><th style="padding:8px 6px;">סטטוס</th>
      <th style="padding:8px 6px;">ביצוע בפועל</th><th style="padding:8px 6px;">תאריך</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" style="padding:24px;text-align:center;color:var(--text3);">אין נושאים לשכבה זו.</td></tr>'}</tbody></table></div>`;
}

/* ── תצוגה ראשית מצטברת ── */
function eduMainTable(){
  const st=eduLoad();
  const scopes=[['שלדג',"יא'"],['שחף',"יא'"],['שיר',"יא'"],['קהילת יב',"יב'"],['אקדמיה',"יא'"]];
  const agg=scopes.map(([sc,layer])=>{
    let plan=0,done=0,part=0,miss=0,post=0;
    eduItems(layer).forEach(x=>[1,2,3,4].forEach(wk=>{
      const e=st[sc+'|'+x.id+'|'+wk];
      if(e&&(e.plan||e.status)) plan++;
      if(e&&e.status==='בוצע')done++; else if(e&&e.status==='בוצע חלקית')part++;
      else if(e&&e.status==='לא בוצע')miss++; else if(e&&e.status==='נדחה')post++;
    }));
    return {sc,layer,plan,done,part,miss,post,pct: plan? Math.round((done+part*0.5)/plan*100):0};
  });
  const T=k=>agg.reduce((a,x)=>a+x[k],0);
  return `<div class="cards" style="margin-bottom:14px;">
      <div class="card" style="border-right:6px solid var(--blue);"><div class="icon">📋</div><div class="val" style="color:var(--blue)">${T('plan')}</div><div class="lbl">משבצות מתוכננות</div></div>
      <div class="card" style="border-right:6px solid #047857;"><div class="icon">✅</div><div class="val" style="color:#047857">${T('done')}</div><div class="lbl">בוצעו</div></div>
      <div class="card" style="border-right:6px solid #b45309;"><div class="icon">🟠</div><div class="val" style="color:#b45309">${T('part')}</div><div class="lbl">חלקית</div></div>
      <div class="card" style="border-right:6px solid #b91c1c;"><div class="icon">🔴</div><div class="val" style="color:#b91c1c">${T('miss')}</div><div class="lbl">לא בוצעו</div></div>
    </div>
    <table class="tbl"><thead><tr><th>קבוצה</th><th>שכבה</th><th>מתוכנן</th><th>בוצע</th><th>חלקית</th><th>לא בוצע</th><th>נדחה</th><th style="min-width:180px;">שיעור ביצוע</th></tr></thead>
    <tbody>${agg.map(a=>`<tr style="background:#fff;">
      <td style="padding:8px 10px;font-weight:700;"><span class="gd" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${GRP_CLR[a.sc]||(a.sc==='אקדמיה'?'#c2410c':'#0891b2')};margin-left:7px;"></span>${a.sc}</td>
      <td style="padding:8px 10px;color:var(--text2);">${a.layer}</td>
      <td style="padding:8px 10px;font-weight:700;">${a.plan}</td>
      <td style="padding:8px 10px;color:#047857;font-weight:700;">${a.done}</td>
      <td style="padding:8px 10px;color:#b45309;font-weight:700;">${a.part}</td>
      <td style="padding:8px 10px;color:#b91c1c;font-weight:700;">${a.miss}</td>
      <td style="padding:8px 10px;color:#6d28d9;font-weight:700;">${a.post}</td>
      <td style="padding:8px 10px;"><div style="display:flex;align-items:center;gap:8px;">
        <div style="flex:1;height:11px;background:#e6ecf4;border-radius:99px;overflow:hidden;"><div style="width:${a.pct}%;height:100%;background:linear-gradient(90deg,#047857,#0891b2);"></div></div>
        <b style="font-family:'Rubik';font-size:12px;min-width:34px;">${a.pct}%</b></div></td></tr>`).join('')}
    </tbody></table>`;
}

/* ═══════════ חוגים · לימודי אחה"צ · רפואי · תזונה ═══════════ */
const DAYS5=['ראשון','שני','שלישי','רביעי','חמישי'];
function gStore(key,def){ try{const r=localStorage.getItem(key); if(r) return JSON.parse(r);}catch(e){} return def; }
function gSave(key,o){ try{localStorage.setItem(key,JSON.stringify(o));}catch(e){} }

/* ── חוגים ── */
const HUG_KEY='bogeret_hugim_v1';

  gSave(HUG_KEY,seed); return seed; }
window.hugSet=function(gid,n,f,v){ const st=hugLoad(); st[n]=st[n]||{}; st[n][f]=v; gSave(HUG_KEY,st);

    </div>
    <table class="tbl"><thead><tr><th>#</th><th>שם החניך</th><th>מעורבות חברתית</th><th>פנאי 1</th><th>פנאי 2</th></tr></thead>

/* ── לימודי אחה"צ ── */
const AFT_KEY='bogeret_after_v1';
function aftLoad(){ const st=gStore(AFT_KEY,null); if(st) return st;
  const seed={}; Object.entries(SEED_AFT).forEach(([n,v])=>{seed[n]={d:v.d||[]};});
  gSave(AFT_KEY,seed); return seed; }
window.aftToggle=function(gid,n,day){ const st=aftLoad(); st[n]=st[n]||{d:[]};
  const arr=st[n].d||[]; const k=arr.indexOf(day); k>=0?arr.splice(k,1):arr.push(day);
  st[n].d=arr.sort(); gSave(AFT_KEY,st); document.getElementById(gid).innerHTML=aftTable(gid); };
window.aftNames={};
function aftTable(gid){
  const st=aftLoad(); const names=window.aftNames[gid];
  const cnt=day=>names.filter(s=>((st[s.n]||{}).d||[]).includes(day)).length;
  const learners=names.filter(s=>((st[s.n]||{}).d||[]).length).length;
  return `<div class="cards" style="margin-bottom:12px;">
      <div class="card" style="border-right:6px solid var(--blue);"><div class="icon">📖</div><div class="val" style="color:var(--blue)">${learners}<span style="font-size:16px;color:var(--text3)">/${names.length}</span></div><div class="lbl">לומדים אחה"צ</div></div>
      ${DAYS5.map((dn,di)=>`<div class="card" style="border-right:6px solid var(--cyan);"><div class="icon">📅</div><div class="val" style="color:var(--cyan)">${cnt(di)}</div><div class="lbl">יום ${dn}</div></div>`).join('')}
    </div>
    <table class="tbl"><thead><tr><th>#</th><th>שם החניך</th>${DAYS5.map(dn=>`<th>${dn}</th>`).join('')}<th>סה"כ ימים</th></tr></thead>
    <tbody>${names.map((s,i)=>{const arr=(st[s.n]||{}).d||[]; const q=s.n.replace(/'/g,"\\'");
      return `<tr style="background:#fff;${arr.length?'':'opacity:.55;'}">
        <td style="padding:5px 9px;color:var(--text3);">${i+1}</td>
        <td style="padding:5px 9px;font-weight:600;white-space:nowrap;">${s.n}</td>
        ${DAYS5.map((dn,di)=>`<td style="padding:4px;text-align:center;"><input type="checkbox" ${arr.includes(di)?'checked':''} onchange="aftToggle('${gid}','${q}',${di})" style="width:17px;height:17px;cursor:pointer;accent-color:#0e7490;"></td>`).join('')}
        <td style="padding:5px;text-align:center;font-weight:800;color:var(--cyan);">${arr.length||'—'}</td>
      </tr>`;}).join('')}</tbody></table>`;
}
function viewAfter(names,gid){

   + `<div class="panel"><div class="panel-h"><h2>📖 לימודי אחה"צ — ${names.length} חניכים</h2></div><div class="panel-b" id="${gid}">${aftTable(gid)}</div></div>`;
}

/* ===== ישיבת בוגרת שבועית — קישורים קבועים. meeting.json מתעדכן אוטומטית ע"י Claude אחרי סידור הקנבה ===== */
async function loadMeetingLinks(){
  const el=document.getElementById('mtBody'); if(!el) return;
  let M=null; try{ const r=await fetch('meeting.json?v='+Date.now(),{cache:'no-store'}); if(r.ok) M=await r.json(); }catch(e){}
  if(!M||!M.current){ el.innerHTML='<div style="color:var(--text2);font-size:13px;">הקישור לישיבה הקרובה יופיע כאן.</div>'; return; }
  const esc=t=>String(t||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const card=(ic,t,d,u)=>`<a href="${esc(u)}" target="_blank" class="link-card" style="margin-bottom:0;"><div class="ic">${ic}</div><div class="info"><h4>${esc(t)}</h4><p>${esc(d)}</p></div></a>`;
  const isAdmin=(typeof ME!=='undefined'&&ME&&ME.mode==='admin');
  el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;">
      ${card('📽️','מצגת הישיבה הקרובה',M.current.title,M.current.view)}
      ${(M.fixed||[]).map(f=>card(f.icon||'🔗',f.title,f.desc,f.url)).join('')}
      ${isAdmin&&M.current.edit?card('✏️','עריכת המצגת (יובל)',M.current.title,M.current.edit):''}
      ${isAdmin&&M.folder?card('🗂️','תיקיית הישיבות בקנבה (יובל)','כל מצגות תשפ"ז',M.folder):''}
    </div>
    ${(M.previous||[]).length?`<div style="margin-top:10px;font-size:12.5px;color:var(--text2);">ישיבות קודמות: ${M.previous.map(x=>`<a href="${esc(x.view)}" target="_blank" style="color:var(--blue);">${esc(x.title)}</a>`).join(' · ')}</div>`:''}

const NDL7=['א','ב','ג','ד','ה','ו','ש'];
const NHALF={a:{bg:'#d9edf0',bd:'#a8d3da',fg:'#0e5c68'}, b:{bg:'#fbeacd',bd:'#eec98a',fg:'#8a5a12'}};
function viewNights(){
  const M=NIGHTS_5787.months;
  let maxOff=0, maxEnd=0;
  M.forEach(m=>{ const off=new Date(m.y,m.mo-1,1).getDay();
    const dim=new Date(m.y,m.mo,0).getDate();
    maxOff=Math.max(maxOff,off); maxEnd=Math.max(maxEnd,off+dim); });
  const COLS=maxEnd;
  const rows=M.map(m=>{
    const off=new Date(m.y,m.mo-1,1).getDay();
    const slot=new Array(COLS).fill(null);
    m.c.forEach(c=>{
      if(c.k==='n'){ const col=off+c.d-1; if(col>=0&&col<COLS) slot[col]={t:'n',c}; }
      else { const a=off+c.a-1, b=off+c.b-1;
        if(a>=0&&a<COLS) slot[a]={t:'x',c,span:b-a+1};
        for(let i=a+1;i<=b&&i<COLS;i++) slot[i]='skip'; }
    });
    let html='';
    for(let i=0;i<COLS;i++){
      const s=slot[i];
      if(s==='skip') continue;
      if(!s){ html+='<td class="nt-e"></td>'; continue; }
      if(s.t==='x'){ html+=`<td colspan="${s.span}" class="nt-x"><b>${s.c.l}</b><span>${s.c.a===s.c.b?s.c.a:s.c.a+'–'+s.c.b}</span></td>`; continue; }
      const c=s.c, h=NHALF[c.h];
      html+=`<td class="nt-n${c.sh?' sh':''}${c.f?' first':''}" style="--bg:${h.bg};--bd:${h.bd};--fg:${h.fg}"
        ${c.sh?`data-sh="${c.sh}"`:''}><b>${c.d}</b><span>${c.p}</span></td>`;
    }
    return `<tr><th class="nt-m">${m.t}</th>${html}</tr>`;
  }).join('');
  const hdr=Array.from({length:COLS},(_,i)=>`<th class="nt-dl">${NDL7[i%7]}</th>`).join('');
  const shTags=[...new Set(M.flatMap(m=>m.c.filter(c=>c.sh).map(c=>c.sh)))];
  return sheetWrap('פנימיית מבואות ים','לוח לילות שנתי · תשפ"ז',
    'משמרת לילה 23:00–01:00 · שני מדריכים בכל לילה',
    [['22','לילות לכל מדריך'],['176','לילות בלוח'],['0','פער בין מדריכים']],
    `<div class="nt-wrap"><table class="nt"><thead><tr><th></th>${hdr}</tr></thead><tbody>${rows}</tbody></table></div>
     <div class="nt-shl"><b>שבתות סגורות:</b> ${shTags.join(' · ')}</div>`,
    [['background:#d9edf0;border-color:#a8d3da',"מחצית א'"],
     ['background:#fbeacd;border-color:#eec98a',"מחצית ב'"],
     ['background:#fff;border:2px solid #c0392b',"שבת סגורה — יש לילות"],
     ['background:#eef1f4;border-color:#dde3ea','שבת בבית או חופשה — אין לילות'],
     ['background:linear-gradient(#fff 60%,#d81b60 60%);border-color:#d81b60','הלילה הראשון של המחצית השנייה']]);

const SOC_KEY='bogeret_social_v1';
const SOC_DEF=[
  {n:'יערה נזר', r:"עו\"סית יא'", clr:'#0284c7',
   h:{'ראשון':'09:00–17:30','שני':'13:30–16:00','שלישי':'09:30–20:00','רביעי':'09:30–20:00','חמישי':'09:30–14:30'}, note:''},
  {n:'עדן שריר', r:"עו\"סית יב'", clr:'#c2410c',
   h:{'ראשון':'09:00–15:00','שני':'14:00–20:00','שלישי':'09:00–17:00','רביעי':'09:00–19:30','חמישי':'09:00–15:00'},
   note:'ביום שני לימודים בשעות 10:00–13:00'},
];
function socLoad(){ try{const r=localStorage.getItem(SOC_KEY); if(r) return JSON.parse(r);}catch(e){}
  return JSON.parse(JSON.stringify(SOC_DEF)); }
function socSave(o){ try{localStorage.setItem(SOC_KEY,JSON.stringify(o));}catch(e){} }
window.socSet=function(i,d,v){ const s=socLoad(); if(d==='note') s[i].note=v; else s[i].h[d]=v; socSave(s); };
function socParse(v){
  const m=String(v||'').match(/(\d{1,2}):(\d{2})\s*[–\-—]\s*(\d{1,2}):(\d{2})/);
  if(!m) return null;
  const a=+m[1]*60+ +m[2], b=+m[3]*60+ +m[4];
  return b>a ? {a,b} : null;
}
const SOC_T0=8*60, SOC_T1=21*60;
function viewSocial(){
  const S=socLoad();
  const slots=[]; for(let m=SOC_T0;m<=SOC_T1;m+=60) slots.push(m);
  const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const totals=S.map(x=>{ let t=0; LZ_DAYS.forEach(d=>{const p=socParse(x.h[d]); if(p) t+=p.b-p.a;}); return t; });

  const lanes=(d)=>S.map((x,i)=>{
    const p=socParse(x.h[d]); if(!p) return '';
    const top=(p.a-SOC_T0)/(SOC_T1-SOC_T0)*100, hgt=(p.b-p.a)/(SOC_T1-SOC_T0)*100;
    return `<div class="socb" style="--c:${x.clr};right:${i*50+1}%;width:47%;top:${top}%;height:${hgt}%;">
      <b>${x.n.split(' ')[0]}</b><span>${fmt(p.a)}</span><span class="to">${fmt(p.b)}</span></div>`;
  }).join('');

  const cal=`<div class="soccal">
    <div class="soc-th"></div>${LZ_DAYS.map(d=>`<div class="soc-th">${d}</div>`).join('')}
    <div class="soc-times">${slots.map((m,i)=>`<div class="soc-tm" style="top:${i/(slots.length-1)*100}%">${fmt(m)}</div>`).join('')}</div>
    ${LZ_DAYS.map(d=>`<div class="soc-col">
      ${slots.map((_,i)=>`<div class="soc-gl" style="top:${i/(slots.length-1)*100}%"></div>`).join('')}
      ${lanes(d)}</div>`).join('')}
  </div>`;

  const edit=`<table class="soc-ed"><thead><tr><th>עו"סית</th>${LZ_DAYS.map(d=>`<th>${d}</th>`).join('')}<th>סה"כ שבועי</th></tr></thead>
    <tbody>${S.map((x,i)=>`<tr>
      <td class="nm" style="color:${x.clr}"><b>${x.n}</b><span>${x.r}</span></td>
      ${LZ_DAYS.map(d=>`<td><input value="${(x.h[d]||'').replace(/"/g,'&quot;')}" oninput="socSet(${i},'${d}',this.value)" placeholder="—"></td>`).join('')}
      <td class="tot">${(totals[i]/60).toFixed(1)} ש'</td></tr>`).join('')}
    </tbody></table>
    ${S.map((x,i)=>x.note?`<div class="soc-nt" style="--c:${x.clr}"><b>${x.n.split(' ')[0]}:</b> ${x.note}</div>`:'').join('')}`;

  return sheetWrap('פנימיית מבואות ים','זמינות שבועית · עו"סיות',
    'השעות שבהן העו"סיות נמצאות בכפר · תשפ"ז',
    S.map((x,i)=>[(totals[i]/60).toFixed(0), x.n.split(' ')[0]+' — שעות שבועיות']),
    cal + `<div class="soc-edt">✏️ עריכת שעות</div>` + edit,
    S.map(x=>[`background:${x.clr}`, x.n]));
}

function memberCard(entry, clr){
  const m = String(entry).match(/^(.*?)\s*\(([^)]*)\)\s*(.*)$/);
  const name = m ? m[1].trim() : String(entry).trim();
  const grp  = m ? m[2].trim() : '';
  const note = m ? m[3].trim() : '';
  const s = STUDENTS_DATA.find(x=>x.n===name) ||
            STUDENTS_DATA.find(x=>name && x.n.includes(name.split(' ')[0]) && (!grp||x.g===grp));
  const gc = GRP_CLR[grp] || GRP_CLR[(s&&s.g)] || clr;
  const av = s ? avatar(s,42,gc)
    : `<div style="width:42px;height:42px;border-radius:50%;flex-shrink:0;background:${gc}22;border:3px solid ${gc};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:${gc};">${name.split(' ').slice(0,2).map(w=>w[0]).join('')}</div>`;
  const click = s ? ` onclick="showStudentDetails(${STUDENTS_DATA.indexOf(s)})" style="cursor:pointer;"` : '';
  return `<div class="lb-c"${click}>
    ${av}
    <div style="flex:1;min-width:0;">
      <div style="font-weight:700;font-size:13px;">${name}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px;">${grp||'—'}${note?' · '+note:''}</div>
    </div></div>`;
}

function staffCard(nameFrag, clr){
  const s = STAFF.find(x=>x.n.split(' ')[0]===nameFrag) || STAFF.find(x=>x.n.includes(nameFrag));
  const av = s && s.photo
    ? `<img src="${s.photo}" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid ${clr};flex-shrink:0;">`
    : `<div style="width:46px;height:46px;border-radius:50%;flex-shrink:0;background:${clr}22;border:3px solid ${clr};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:${clr};">${(s?s.n:nameFrag).split(' ').slice(0,2).map(w=>w[0]).join('')}</div>`;
  return `<div class="lb-c" style="background:${clr}0d;border-color:${clr}40;">
    ${av}
    <div style="flex:1;min-width:0;">
      <div style="font-weight:700;font-size:13px;">${s?s.n:nameFrag}</div>
      <div style="font-size:11px;color:${clr};font-weight:600;margin-top:2px;">${s?s.r:'איש צוות'}</div>
    </div></div>`;
}

const GOALS_KEY='bogeret_goals_v1';
function goalsLoad(){ try{const r=localStorage.getItem(GOALS_KEY); if(r) return JSON.parse(r);}catch(e){} 
  return [{t:'',why:'',how:'',who:'',when:'',st:'לא התחיל'}]; }
function goalsSave(o){ try{localStorage.setItem(GOALS_KEY,JSON.stringify(o));}catch(e){} }
window.goalSet=function(i,f,v){ const g=goalsLoad(); g[i][f]=v; goalsSave(g); if(f==='st') renderGoals(); };
window.goalAdd=function(){ const g=goalsLoad(); g.push({t:'',why:'',how:'',who:'',when:'',st:'לא התחיל'}); goalsSave(g); renderGoals(); };
window.goalDel=function(i){ const g=goalsLoad(); g.splice(i,1); goalsSave(g.length?g:[{t:'',why:'',how:'',who:'',when:'',st:'לא התחיל'}]); renderGoals(); };
const GOAL_ST={'לא התחיל':'#8496ab','בתהליך':'#b45309','הושג':'#047857'};
window.renderGoals=function(){
  const el=document.getElementById('goalsBody'); if(!el) return;
  const g=goalsLoad();
  el.innerHTML = g.map((x,i)=>`<div style="background:#fff;border:1px solid var(--border);border-right:5px solid ${GOAL_ST[x.st]||'#8496ab'};border-radius:12px;padding:14px;margin-bottom:11px;">

      <input value="${(x.t||'').replace(/"/g,'&quot;')}" oninput="goalSet(${i},'t',this.value)" placeholder="שם היעד…" style="flex:1;border:none;border-bottom:2px solid var(--border);padding:5px 2px;font-family:'Rubik';font-weight:700;font-size:15px;outline:none;">

        ${['לא התחיל','בתהליך','הושג'].map(s=>`<option ${s===x.st?'selected':''}>${s}</option>`).join('')}</select>
      <button onclick="goalDel(${i})" class="btn btn-secondary" style="padding:4px 10px;font-size:12px;">מחק</button>

const FB_CONFIG = {
  apiKey: "AIzaSyDytvmAX1Sm8KEKINOreUeRutDbnxinVXA",
  authDomain: "yudbet-almog.firebaseapp.com",
  databaseURL: "https://yudbet-almog-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "yudbet-almog",
  storageBucket: "yudbet-almog.firebasestorage.app",
  messagingSenderId: "933488998542",
  appId: "1:933488998542:web:c3a36396573c808ba071df"
};

const SYNC = (() => {
  const USER_KEY='bogeret_user', VERS_KEY='bogeret_versions', META_KEY='bogeret_meta';
  const RETAIN_DAYS=14, MAX_LOCAL=30, ROOT='portal/bogeret';
  let rdb=null, fb=null, ready=false, applying=false, timer=null, lastTouch=0;
  let lastSent={}, meta={};

  const isOurKey = k => k && (k.startsWith('bogeret_') || k.startsWith('kn_') ||
      k.startsWith('knowledge_') || k==='emergency_url')
    && k!==USER_KEY && k!==VERS_KEY && k!==META_KEY;

  /* ── קידוד בטוח למפתחות Firebase ── */
  const enc = s => encodeURIComponent(String(s)).replace(/\./g,'%2E').replace(/\$/g,'%24');
  const dec = s => { try{ return decodeURIComponent(s); }catch(e){ return s; } };

  /* ── פיצול מפתח אחסון לרשומות בודדות ── */
  function split(raw){
    if(raw==null) return {};
    try{ const o=JSON.parse(raw);
      if(o && typeof o==='object' && !Array.isArray(o)) return o;
    }catch(e){}
    return {__all: raw};
  }
  function join(recs){
    const ks=Object.keys(recs);
    if(ks.length===1 && ks[0]==='__all') return recs.__all;
    return JSON.stringify(recs);
  }
  const sig = v => JSON.stringify(v===undefined?null:v);

  function snapshot(){
    const o={};
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(isOurKey(k)) o[k]=localStorage.getItem(k); }
    return o;
  }
  const user = () => localStorage.getItem(USER_KEY) || 'לא ידוע';
  const setUser = n => localStorage.setItem(USER_KEY, n);
  function metaSave(){ try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }catch(e){} }
  function metaLoad(){ try{ meta=JSON.parse(localStorage.getItem(META_KEY)||'{}'); }catch(e){ meta={}; } }

  /* ── סימון בסיס: מה שיש עכשיו נחשב "כבר מסונכרן" ── */
  function baseline(){
    lastSent={};
    const st=snapshot();
    Object.entries(st).forEach(([k,raw])=>{
      Object.entries(split(raw)).forEach(([rk,v])=>{ lastSent[k+'\u0000'+rk]=sig(v); });
    });
  }

  /* ── גרסאות מקומיות ── */
  function localVersions(){ try{return JSON.parse(localStorage.getItem(VERS_KEY)||'[]');}catch(e){return [];} }
  function pushLocal(state, note){
    let v=localVersions();
    v.unshift({at:Date.now(), by:user(), note:note||'שמירה אוטומטית', s:state});
    const cut=Date.now()-RETAIN_DAYS*864e5;
    v=v.filter((x,i)=> i<MAX_LOCAL && x.at>cut);
    try{ localStorage.setItem(VERS_KEY, JSON.stringify(v)); }
    catch(e){ try{ localStorage.setItem(VERS_KEY, JSON.stringify(v.slice(0,8))); }catch(e2){} }
  }

  async function connect(){
    if(ready) return true;
    try{
      const appMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      fb = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
      const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(FB_CONFIG);
      rdb = fb.getDatabase(app);
      const s = await fb.get(fb.ref(rdb, ROOT+'/m'));
      if(s.exists()) mergeCloud(s.val());
      ready = true;
      baseline();
      listen();
      cleanupCloud();
      return true;
    }catch(e){ console.warn('Firebase:',e); ready=false; return false; }
  }

  /* ── מיזוג: רשומה־רשומה, האחרון בזמן מנצח ── */
  function mergeCloud(m){
    if(!m) return false;
    let changed=0;
    applying=true;
    try{
      Object.entries(m).forEach(([ek,recs])=>{
        const k=dec(ek); if(!isOurKey(k) || !recs) return;
        const cur=split(localStorage.getItem(k));
        const out={...cur}; let dirty=false;
        Object.entries(recs).forEach(([erk,cell])=>{
          if(!cell || typeof cell!=='object' || cell.v===undefined) return;
          const rk=dec(erk), mk=k+'\u0000'+rk;
          const localAt=meta[mk]||0;
          if((cell.at||0) >= localAt && sig(out[rk])!==sig(cell.v)){
            out[rk]=cell.v; meta[mk]=cell.at||0; dirty=true; changed++;
          }
        });
        if(dirty) localStorage.setItem(k, join(out));
      });
    } finally { applying=false; }
    if(changed) metaSave();
    return changed>0;
  }

  function listen(){
    fb.onValue(fb.ref(rdb, ROOT+'/m'), s=>{
      if(!s.exists()) return;
      if(mergeCloud(s.val())){
        baseline();
        if(Date.now()-lastTouch > 15000){ location.reload(); }
        else banner('הפורטל עודכן על ידי מדריך אחר', true);
      }
    });
  }

  /* ── דחיפה: רק רשומות שהשתנו ── */
  async function push(note){
    const st=snapshot();
    pushLocal(st, note);
    if(!ready){ status('לא מחובר'); return; }
    const now=Date.now(), upd={}, sent={};
    Object.entries(st).forEach(([k,raw])=>{
      Object.entries(split(raw)).forEach(([rk,v])=>{
        const mk=k+'\u0000'+rk, s2=sig(v);
        if(lastSent[mk]===s2) return;
        upd['m/'+enc(k)+'/'+enc(rk)]={v:v, at:now, by:user()};
        sent[mk]=s2; meta[mk]=now;
      });
    });
    const n=Object.keys(upd).length;
    if(!n){ status(); return; }
    try{
      await fb.update(fb.ref(rdb, ROOT), upd);
      await fb.set(fb.ref(rdb, ROOT+'/versions/'+now),
        { state: JSON.stringify(st), by:user(), at:now, note: note||'שמירה אוטומטית' });
      Object.assign(lastSent, sent); metaSave();
      status('נשמר ✓ ('+n+')'); setTimeout(()=>status(), 2500);
    }catch(e){ status('השמירה נכשלה'); console.warn(e); }
  }

  async function cloudVersions(){
    if(!ready) return [];
    try{
      const s = await fb.get(fb.query(fb.ref(rdb, ROOT+'/versions'), fb.limitToLast(60)));
      if(!s.exists()) return [];
      return Object.entries(s.val()).map(([id,v])=>({id, ...v})).sort((a,b)=>b.at-a.at);
    }catch(e){ return []; }
  }
  async function cleanupCloud(){
    try{
      const cut=Date.now()-RETAIN_DAYS*864e5;
      const s = await fb.get(fb.ref(rdb, ROOT+'/versions'));
      if(!s.exists()) return;
      for(const [id,v] of Object.entries(s.val()))
        if((v.at||0) < cut) await fb.remove(fb.ref(rdb, ROOT+'/versions/'+id));
    }catch(e){}
  }

  /* ── שחזור ומיזוג: אוסף כל הגרסאות ומשלב ── */
  async function recoverMerge(){
    const cloud=await cloudVersions();
    const all=[...cloud.map(v=>({at:v.at, by:v.by, s:(()=>{try{return JSON.parse(v.state);}catch(e){return null;}})()})),
               ...localVersions()].filter(x=>x.s).sort((a,b)=>a.at-b.at);
    if(!all.length) return {n:0, src:0};
    const merged={};
    all.forEach(v=>{
      Object.entries(v.s).forEach(([k,raw])=>{
        if(!isOurKey(k)) return;
        merged[k]=merged[k]||{};
        Object.entries(split(raw)).forEach(([rk,val])=>{
          const cur=merged[k][rk];
          const empty = val==null || sig(val)==='{}' || sig(val)==='""';
          if(!cur || !empty) merged[k][rk]={v:val, at:v.at};
        });
      });
    });
    // המצב הנוכחי גובר אם הוא חדש יותר
    Object.entries(snapshot()).forEach(([k,raw])=>{
      merged[k]=merged[k]||{};
      Object.entries(split(raw)).forEach(([rk,val])=>{
        const mk=k+'\u0000'+rk, localAt=meta[mk]||0, cur=merged[k][rk];
        if(!cur || localAt>=cur.at) merged[k][rk]={v:val, at:localAt||Date.now()};
      });
    });
    let n=0;
    applying=true;
    try{
      Object.entries(merged).forEach(([k,recs])=>{
        const out={}; Object.entries(recs).forEach(([rk,c])=>{ out[rk]=c.v; meta[k+'\u0000'+rk]=c.at; n++; });
        if(Object.keys(out).length) localStorage.setItem(k, join(out));
      });
    } finally { applying=false; }
    metaSave(); baseline();
    await push('שחזור ומיזוג גרסאות');
    return {n, src:all.length};
  }

  function hook(){
    const orig = localStorage.setItem.bind(localStorage);
    localStorage.setItem = function(k,v){ orig(k,v); if(!applying && isOurKey(k)){ lastTouch=Date.now(); schedule(); } };
  }
  function schedule(){
    clearTimeout(timer);
    status('שינוי — נשמר בעוד רגע…');
    timer=setTimeout(()=>{ timer=null; push(); }, 2500);
  }

  function status(msg){
    const el=document.getElementById('syncDot'); if(!el) return;
    el.style.background = ready ? '#047857' : '#b91c1c';
    const lb=document.getElementById('syncLbl');
    if(lb) lb.textContent = msg || (ready ? 'מסונכרן' : '⚠ לא מחובר');
    const btn=document.getElementById('syncBtn');
    if(btn && !ready){ btn.style.borderColor='#b91c1c'; btn.style.color='#b91c1c'; }
    el.title = msg || (ready ? 'מסונכרן בענן' : 'לא מחובר — השינויים שלך לא מגיעים לצוות');
  }
  function offlineWarn(){
    if(document.getElementById('offBar')) return;
    const d=document.createElement('div'); d.id='offBar';
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:10000;background:#b91c1c;color:#fff;'+
      'padding:11px 18px;font-family:Heebo;font-size:14px;font-weight:700;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.3);';
    d.innerHTML='⚠ אין חיבור לענן — <u>מה שתמלא כאן לא יגיע לצוות</u>. ודא שנכנסת דרך הקישור הרשמי של הפורטל ולא מקובץ שהורדת. '+
      '<button onclick="SYNC.retry()" style="background:#fff;color:#b91c1c;border:none;border-radius:7px;padding:4px 13px;margin-right:10px;cursor:pointer;font-family:Heebo;font-weight:800;">נסה שוב</button>';
    document.body.appendChild(d);
    document.body.style.paddingTop='44px';
  }
  function offlineClear(){ const d=document.getElementById('offBar'); if(d){ d.remove(); document.body.style.paddingTop=''; } }
  function banner(txt, reload){
    let b=document.getElementById('syncBanner');
    if(!b){ b=document.createElement('div'); b.id='syncBanner';
      b.style.cssText='position:fixed;bottom:18px;left:18px;z-index:9999;background:#0f1e2e;color:#fff;padding:12px 18px;border-radius:12px;font-family:Heebo;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;max-width:88vw;';
      document.body.appendChild(b); }
    b.innerHTML=`<span>${txt}</span>`+(reload?`<button onclick="location.reload()" style="background:#1d4ed8;border:none;color:#fff;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:Heebo;font-weight:700;">רענן</button>`:'')+
      `<button onclick="this.parentElement.remove()" style="background:none;border:none;color:#8496ab;cursor:pointer;font-size:16px;">✕</button>`;
    if(!reload) setTimeout(()=>{ if(b) b.remove(); }, 3500);
  }

  async function retry(){ status('מתחבר…'); const ok=await connect(); status(); if(ok){ offlineClear(); banner('החיבור הצליח ✓'); setTimeout(()=>location.reload(),900);} else offlineWarn(); }

  async function init(){
    metaLoad();
    if(window.ME && ME.n) setUser(ME.n);
    else if(!localStorage.getItem(USER_KEY)) setUser('מדריך');
    status('מתחבר…');
    const ok=await connect();
    if(!ok){ baseline(); offlineWarn(); }
    hook();
    status();
    window.addEventListener('beforeunload', ()=>{ if(timer){ clearTimeout(timer); push(); } });
  }

  return { init, push, connect, retry, user, setUser, localVersions, cloudVersions,
           recoverMerge, snapshot, isReady:()=>ready, status, banner,
           restoreState:(o)=>{ applying=true; try{
             for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i); if(isOurKey(k)) localStorage.removeItem(k);}
             Object.entries(o||{}).forEach(([k,v])=>localStorage.setItem(k,v));
           } finally{applying=false;} meta={}; metaSave(); } };
})();

window.restoreVersion = async function(src,ref){
  if(!confirm('לשחזר את הפורטל לגרסה הזו? המצב הנוכחי יישמר כגיבוי לפני השחזור.')) return;
  await SYNC.push('לפני שחזור');
  let state=null;
  if(src==='local'){ const v=SYNC.localVersions()[+ref]; state=v&&v.s; }
  else { const all=await SYNC.cloudVersions(); const v=all.find(x=>x.id===ref); state=v&&JSON.parse(v.state); }
  if(!state){ alert('הגרסה לא נמצאה'); return; }
  SYNC.restoreState(state);
  await SYNC.push('שחזור גרסה');
  location.reload();
};

function getKnowledge(type) {
  return JSON.parse(localStorage.getItem('knowledge_'+type) || '[]');
}
function saveKnowledge(type, items) {
  localStorage.setItem('knowledge_'+type, JSON.stringify(items));
}
function addKnowledge(type) {
  const ttl = prompt('כותרת:');
  if (!ttl) return;
  const cnt = prompt('תוכן:');
  if (!cnt) return;
  const items = getKnowledge(type);
  items.unshift({title:ttl, content:cnt, date:new Date().toLocaleDateString('he-IL')});
  saveKnowledge(type, items);
  renderKnowledge();
}
function delKnowledge(type, idx) {
  if (!confirm('למחוק?')) return;
  const items = getKnowledge(type);
  items.splice(idx,1);
  saveKnowledge(type, items);
  renderKnowledge();
}

function renderKnowledge() {
  ['meetings','contracts','weekly','personal_talks','events','safety'].forEach(type => {

function loadEduPlan() {
  // בודק גרסה - אם השתנתה, מאפס את הנתונים השמורים
  const savedVersion = localStorage.getItem(STORAGE_VERSION_KEY);
  if (savedVersion !== CURRENT_VERSION) {
    console.log('EDU: גרסה חדשה זוהתה (' + savedVersion + ' -> ' + CURRENT_VERSION + ') - טעינה מחדש');
    localStorage.removeItem(STORAGE_KEY);
    localStorage.setItem(STORAGE_VERSION_KEY, CURRENT_VERSION);
  }
  
  // טוען מ-localStorage או מהברירת מחדל
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      EDU_DATA = JSON.parse(saved);
      // מוצא את ה-id הגבוה ביותר כדי לקבוע את הבא
      EDU_DATA.forEach(r => {
        const m = (r.id || '').match(/edu_(\d+)/);
        if (m) {
          const n = parseInt(m[1]);
          if (n >= EDU_NEXT_ID) EDU_NEXT_ID = n + 1;
        }
      });
      console.log('EDU: נטענו ' + EDU_DATA.length + ' פריטים מהדפדפן');
    } else {
      EDU_DATA = JSON.parse(JSON.stringify(EDU_DEFAULT_DATA));
      console.log('EDU: נטענו ' + EDU_DATA.length + ' פריטים מברירת מחדל');
    }
  } catch(e) {
    console.error('EDU: שגיאה בטעינה -', e);
    EDU_DATA = JSON.parse(JSON.stringify(EDU_DEFAULT_DATA));
  }
  
  const loading = document.getElementById('edu-loading');
  const content = document.getElementById('edu-content');
  if (loading) loading.style.display = 'none';
  if (content) content.style.display = 'block';
  renderEduPlan();
}

function saveEduPlan() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(EDU_DATA));
  } catch(e) {
    alert('שגיאה בשמירה: ' + e.message);
  }
}

  localStorage.removeItem(STORAGE_KEY);
  localStorage.setItem(STORAGE_VERSION_KEY, CURRENT_VERSION);
  EDU_DATA = JSON.parse(JSON.stringify(EDU_DEFAULT_DATA));
  EDU_NEXT_ID = 1000;
  renderEduPlan();
}

function renderEduPlan() {

    const btn = document.getElementById('edu-tab-'+t);
    if (btn) {
      const active = (t === EDU_FILTER);
      btn.style.background = active ? '#fff' : 'transparent';
      btn.style.color = active ? '#1d4ed8' : '#64748b';
      btn.style.border = active ? '2px solid #2563eb' : '1px solid var(--brd)';

  if (EDU_FILTER === 'ya') {
    data = EDU_DATA.filter(r => {
      const l = (r.layer || '').replace(/['\"׳״]/g, '').trim();
      return l === 'יא' || l.startsWith('יא');
    });
  } else if (EDU_FILTER === 'yb') {
    data = EDU_DATA.filter(r => {
      const l = (r.layer || '').replace(/['\"׳״]/g, '').trim();
      return l === 'יב' || l.startsWith('יב');
    });
  }
  
  console.log('EDU סינון:', EDU_FILTER, '- נמצאו', data.length, 'פריטים');
  
  // קיבוץ לפי חודש
  const byMonth = {};
  data.forEach(r => {
    if (!byMonth[r.month]) byMonth[r.month] = [];
    byMonth[r.month].push(r);
  });
  
  // מיון חודשים
  let sortedMonths = Object.keys(byMonth).sort((a,b) => {
    const ai = MONTH_ORDER.indexOf(a);
    const bi = MONTH_ORDER.indexOf(b);
    if (ai === -1 && bi === -1) return a.localeCompare(b, 'he');
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });
  
  // מסנן פריטים שבוצעו (אם הצ'קבוקס מסומן)
  const hideCompleted = document.getElementById('edu-hide-done')?.checked;

  }
  
  let html = '<div id="edu-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;">';
  
  sortedMonths.forEach(month => {

    const allDone = items.every(it => it.status === 'בוצע');

    html += `<div class="edu-month-card" data-month="${escapeAttr(month)}" style="background:#fff;border:1px solid var(--brd);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);opacity:${opacity};">
