        <div style="display:flex;align-items:center;gap:6px;font-size:15px;">📅 ${escapeHtml(month)}</div>
        <div style="display:flex;gap:6px;align-items:center;">
          <span style="font-size:11px;font-weight:500;opacity:.9;">${items.length}</span>
          <button onclick="addEduItem('${escapeAttr(month)}')" style="background:rgba(255,255,255,0.25);border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;font-weight:bold;" title="הוסף נושא">+</button>
        </div>
      </div>
      <div class="edu-items" data-month="${escapeAttr(month)}" style="padding:10px;min-height:60px;">`;
    
    items.forEach(it => {
      const isDone = it.status === 'בוצע';
      let bg, color2, border, prefix, icon;
      if (it.category === 'נושא חודש') {
        bg = isDone ? '#f1f5f9' : '#fff7ed'; color2 = isDone ? '#94a3b8' : '#9a3412'; border = isDone ? '#94a3b8' : '#ea580c'; icon = '🎯';
      } else if (it.category === 'אירוע') {
        bg = isDone ? '#f8fafc' : '#fef2f2'; color2 = isDone ? '#94a3b8' : '#991b1b'; border = isDone ? '#94a3b8' : '#dc2626'; icon = '⭐';
      } else {
        bg = isDone ? '#f8fafc' : '#eff6ff'; color2 = isDone ? '#94a3b8' : '#1e293b'; border = isDone ? '#94a3b8' : '#3b82f6'; icon = '📚';
      }
      const strike = isDone ? 'text-decoration:line-through;' : '';
      
      html += `<div class="edu-item" draggable="true" data-id="${escapeAttr(it.id)}" 
        style="padding:8px 10px;margin-bottom:5px;background:${bg};border-right:3px solid ${border};border-radius:6px;font-size:12.5px;color:${color2};${strike};cursor:grab;display:flex;justify-content:space-between;align-items:center;gap:6px;">

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeAttr(s) {
  return String(s).replace(/['"\\]/g, c => '\\' + c);
}

let DRAG_ITEM_ID = null;

function setupEduDragDrop() {
  document.querySelectorAll('.edu-item').forEach(el => {
    el.addEventListener('dragstart', e => {
      DRAG_ITEM_ID = el.dataset.id;
      el.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', e => {
      el.style.opacity = '';
      DRAG_ITEM_ID = null;
      document.querySelectorAll('.edu-item').forEach(x => x.style.borderTop = '');
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = el.getBoundingClientRect();
      const middle = rect.top + rect.height / 2;
      el.style.borderTop = (e.clientY < middle) ? '2px solid var(--blue)' : '';
      el.style.borderBottom = (e.clientY >= middle) ? '2px solid var(--blue)' : '';
    });
    el.addEventListener('dragleave', e => {
      el.style.borderTop = '';
      el.style.borderBottom = '';
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      const rect = el.getBoundingClientRect();
      const middle = rect.top + rect.height / 2;
      const insertBefore = e.clientY < middle;
      handleEduDrop(el.dataset.id, insertBefore);
    });
  });
  
  document.querySelectorAll('.edu-items').forEach(container => {
    container.addEventListener('dragover', e => { e.preventDefault(); });
    container.addEventListener('drop', e => {
      // אם נופל ישירות על הקונטיינר ולא על פריט, מוסיף לסוף
      if (e.target === container) {
        e.preventDefault();
        const month = container.dataset.month;
        moveItemToMonth(DRAG_ITEM_ID, month, null);
      }
    });
  });
}

function handleEduDrop(targetId, insertBefore) {
  if (!DRAG_ITEM_ID || DRAG_ITEM_ID === targetId) return;
  const target = EDU_DATA.find(r => r.id === targetId);
  if (!target) return;
  moveItemToMonth(DRAG_ITEM_ID, target.month, targetId, insertBefore);
}

function moveItemToMonth(itemId, targetMonth, beforeId, insertBefore = true) {
  const item = EDU_DATA.find(r => r.id === itemId);
  if (!item) return;
  
  item.month = targetMonth;
  
  // ממיין מחדש את כל הפריטים בחודש היעד
  const sameMonth = EDU_DATA.filter(r => r.month === targetMonth && r.layer === item.layer);
  
  if (beforeId) {
    const targetItem = EDU_DATA.find(r => r.id === beforeId);
    if (targetItem) {
      // הוצא את הפריט הזה זמנית
      sameMonth.sort((a,b) => a.order - b.order);
      const filtered = sameMonth.filter(r => r.id !== itemId);
      const idx = filtered.findIndex(r => r.id === beforeId);
      const insertAt = insertBefore ? idx : idx + 1;
      filtered.splice(insertAt, 0, item);
      filtered.forEach((r, i) => { r.order = i + 1; });
    }
  } else {
    // הוסף לסוף
    sameMonth.sort((a,b) => a.order - b.order);
    const filtered = sameMonth.filter(r => r.id !== itemId);
    filtered.push(item);
    filtered.forEach((r, i) => { r.order = i + 1; });
  }
  
  saveEduPlan();
  renderEduPlan();
}

function addEduItem(month) {
  const topic = prompt('שם הנושא החדש:');
  if (!topic || !topic.trim()) return;
  
  const cat = prompt('סוג: 1=נושא חודש, 2=נושא רגיל, 3=אירוע (ברירת מחדל: 2)', '2');
  let category = 'נושא';
  if (cat === '1') category = 'נושא חודש';
  else if (cat === '3') category = 'אירוע';
  
  const layer = (EDU_FILTER === 'ya') ? "יא'" : (EDU_FILTER === 'yb') ? "יב'" : "יב'";
  
  const sameMonth = EDU_DATA.filter(r => r.month === month && r.layer === layer);
  const maxOrder = sameMonth.reduce((m, r) => Math.max(m, r.order), 0);
  
  EDU_DATA.push({
    id: 'edu_' + (EDU_NEXT_ID++),
    layer: layer,
    month: month,
    order: maxOrder + 1,
    topic: topic.trim(),
    category: category,
    status: 'פעיל'
  });
  
  saveEduPlan();
  renderEduPlan();
}

function editEduItem(id) {
  const item = EDU_DATA.find(r => r.id === id);
  if (!item) return;
  const newTopic = prompt('עריכת נושא:', item.topic);
  if (!newTopic || !newTopic.trim()) return;
  item.topic = newTopic.trim();
  saveEduPlan();
  renderEduPlan();
}

function toggleEduStatus(id) {
  const item = EDU_DATA.find(r => r.id === id);
  if (!item) return;
  item.status = (item.status === 'בוצע') ? 'פעיל' : 'בוצע';
  saveEduPlan();
  renderEduPlan();
}

function deleteEduItem(id) {
  if (!confirm('למחוק את הנושא?')) return;
  EDU_DATA = EDU_DATA.filter(r => r.id !== id);
  saveEduPlan();
  renderEduPlan();
}

function addEduMonth() {
  const month = prompt('שם החודש החדש (למשל: יולי):');
  if (!month || !month.trim()) return;
  const layer = (EDU_FILTER === 'ya') ? "יא'" : "יב'";
  // נוסיף נושא ראשון לחודש החדש
  EDU_DATA.push({
    id: 'edu_' + (EDU_NEXT_ID++),
    layer: layer,
    month: month.trim(),
    order: 1,
    topic: 'נושא ראשון',
    category: 'נושא חודש',
    status: 'פעיל'
  });
  saveEduPlan();
  renderEduPlan();
}

    const cardName = card.dataset.name || '';

  const countEl = document.getElementById('alphon-count');

    countEl.textContent = visibleCount + ' חניכים';

  document.getElementById('gradTitle').textContent = y ? ('🎓 בוגרי '+y+(CYCLE_BY_YEAR[y]?' — מחזור '+CYCLE_BY_YEAR[y]:'')) : '❓ בוגרים ללא שיוך שנה';
  document.querySelectorAll('#gradSubnav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else { const u=document.getElementById('gradUnassignedBtn'); if(u) u.classList.add('active'); }
  renderGrads(document.getElementById('gradSearch').value);

const inp=(i,f,v,w)=>`<input value="${(v||'').replace(/"/g,'&quot;')}" oninput="gradsUpdate(${i},'${f}',this.value)" placeholder="—" style="border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-family:'Heebo';font-size:12px;width:${w}px;">`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const sel=(i,f,opts,v)=>`<select onchange="gradsUpdate(${i},'${f}',this.value)" style="border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-family:'Heebo';font-size:12px;">${opts.map(o=>`<option value="${esc(o)}" ${o===(v||'')?'selected':''}>${o||'—'}</option>`).join('')}</select>`;

window.renderGrads = function(filter){
  const tb=document.getElementById('gradsTbody'); if(!tb) return;
  const f=(filter||'').trim(); const all=gradsAll();
  const rows = all.map((g,i)=>({g:gradRec(g), i}))
    .filter(o=> (o.g.year||'')===window.gradCurYear )
    .filter(o=> !f || o.g.name.includes(f) || (o.g.group||'').includes(f) || (o.g.madrich||'').includes(f) );
  tb.innerHTML = rows.map(({g,i},n)=>`<tr style="background:#fff;">
      <td style="padding:6px 8px;color:var(--text3);">${n+1}</td>
      <td style="padding:6px 8px;font-weight:600;white-space:nowrap;">${g.name}</td>
      <td style="padding:6px 8px;">${CYCLE_BY_YEAR[g.year]?`<span class="pill">${CYCLE_BY_YEAR[g.year]}</span>`:'<span style="color:var(--text3)">טרם נקבע</span>'}</td>
      <td style="padding:6px 8px;">${g.smallgroup?`<span class="pill">${g.smallgroup}</span>`:inp(i,'smallgroup',g.smallgroup,80)}</td>
      <td style="padding:6px 8px;">${inp(i,'madrich',g.madrich,85)}</td>
      <td style="padding:6px 8px;">${inp(i,'phone',g.phone,105)}</td>
      <td style="padding:6px 8px;">${inp(i,'email',g.email,150)}</td>
      <td style="padding:6px 8px;">${g.city||inp(i,'city',g.city,80)}</td>
      <td style="padding:6px 8px;font-size:11.5px;color:var(--text2);white-space:nowrap;">${[g.father,g.mother].filter(Boolean).join(' · ')||'—'}</td>
      <td style="padding:6px 8px;">${sel(i,'track',TRACKS,g.track)}</td>
      <td style="padding:6px 8px;">${inp(i,'detail',g.detail,110)}</td>
      <td style="padding:6px 8px;">${sel(i,'status',STATUSES,g.status)}</td>
      <td style="padding:6px 8px;">${sel(i,'year',GRAD_YEARS_ALL,g.year)}</td>
      <td style="padding:6px 8px;"><button onclick="gradsClear(${i})" class="btn btn-secondary" style="padding:3px 8px;font-size:11px;">נקה</button></td>
    </tr>`).join('') || '<tr><td colspan="12" style="padding:22px;text-align:center;color:var(--text3);">אין בוגרים בשנה הזו</td></tr>';
  gradsStats(rows.map(r=>r.g));
};

window.gradsUpdate = function(i,f,v){
  const g=gradsAll()[i]; if(!g) return;
  const s=gradsLoad(); s[g.name]=s[g.name]||{}; s[g.name][f]=v; gradsSave(s);
  if(f==='year'){ renderGrads(document.getElementById('gradSearch').value); }
  else gradsStats();
};
window.gradsClear = function(i){
  const g=gradsAll()[i]; if(!g) return;
  const s=gradsLoad(); delete s[g.name]; gradsSave(s);
  renderGrads(document.getElementById('gradSearch').value);
};
function gradsStats(list){
  const box=document.getElementById('grads-stats'); if(!box) return;
  const L = list || gradsAll().map(gradRec).filter(g=>(g.year||'')===window.gradCurYear);
  const c={}; L.forEach(g=>{ if(g.track) c[g.track]=(c[g.track]||0)+1; });
  const done=Object.values(c).reduce((a,b)=>a+b,0);
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3);
  box.innerHTML=`
    <div class="card"><div class="icon">🎓</div><div class="val" style="color:var(--blue)">${L.length}</div><div class="lbl">בוגרים במחזור</div></div>
    <div class="card"><div class="icon">✅</div><div class="val" style="color:var(--emerald)">${done}</div><div class="lbl">מסלול מתועד</div></div>
    <div class="card"><div class="icon">❓</div><div class="val" style="color:var(--orange)">${L.length-done}</div><div class="lbl">ממתין לתיעוד</div></div>
    ${top.map(([k,v])=>`<div class="card"><div class="icon">📌</div><div class="val" style="color:var(--purple)">${v}</div><div class="lbl">${k}</div></div>`).join('')}`;
}

window.exportGrads = function(){
  const rows=[['שנת סיום','שם הבוגר','מחזור מסיים','קבוצה','מדריך','טלפון','מייל','עיר','ת.ז','כתובת','שם האב','שם האם','מסלול','פירוט','סטטוס']];
  gradsAll().map(gradRec).forEach(g=>rows.push([g.year||'',g.name,CYCLE_BY_YEAR[g.year]||'',g.smallgroup||'',g.madrich||'',g.phone||'',g.email||'',g.city||'',g.tz||'',g.addr||'',g.father||'',g.mother||'',g.track||'',g.detail||'',g.status||'']));
  const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='בוגרים.csv'; a.click();
};

window.filterRamzorMatrix = function() {
  const search = (document.getElementById('ramzor-search')?.value || '').trim();
  const grp = document.getElementById('ramzor-grp-filter')?.value || 'all';
  const status = document.getElementById('ramzor-status-filter')?.value || 'all';
  
  document.querySelectorAll('.ramzor-row').forEach((row, idx) => {
    const name = row.dataset.name || '';
    const rowGrp = row.dataset.group || '';
    const matchSearch = !search || name.includes(search);
    const matchGrp = grp === 'all' || rowGrp === grp;
    
    // סינון סטטוס: בודקים אם יש לחניך את הסטטוס באיזשהו חודש
    let matchStatus = (status === 'all');
    if (!matchStatus) {
      const student = RAMZOR_DATA[idx];
      if (student && student.s) {
        // בודק אם יש את הסטטוס באחד החודשים
        matchStatus = Object.values(student.s).includes(status);
      }
    }
    
    row.style.display = (matchSearch && matchGrp && matchStatus) ? '' : 'none';
  });
  
  // גם נעדכן את התמורות בעמודות החודש - אם נבחר סטטוס מסוים,
  // נדגיש את העיגולים של אותו סטטוס בעמודות החודש
};

const RAMZOR_KEY='bogeret_ramzor_v1';
function ramzorStore(){ try{const r=localStorage.getItem(RAMZOR_KEY); if(r) return JSON.parse(r);}catch(e){} return {}; }
function ramzorPersist(o){ try{ localStorage.setItem(RAMZOR_KEY, JSON.stringify(o)); }catch(e){} }

window.setRamzor = function(month, val){
  const r = RAMZOR_DATA_NEW[window.ramzorIdx]; if(!r) return;
  r.s[month] = val;
  const st=ramzorStore(); st[r.n]=st[r.n]||{s:{},nt:{}}; st[r.n].s[month]=val; ramzorPersist(st);
  showRamzorDetails(window.ramzorIdx);
  refreshRamzorCell(r, month);
  if(window.refreshAggregates) refreshAggregates();
};
window.setRamzorNote = function(month, val){
  const r = RAMZOR_DATA_NEW[window.ramzorIdx]; if(!r) return;
  r.nt[month] = val;
  const st=ramzorStore(); st[r.n]=st[r.n]||{s:{},nt:{}}; st[r.n].nt[month]=val; ramzorPersist(st);
  if(window.refreshAggregates) refreshAggregates();
};
function refreshRamzorCell(r, month){
  const CLR={none:'#cbd5e1',green:'#059669',orange:'#ea580c',red:'#dc2626',yellow:'#eab308'};
  const mi=['ספטמבר','אוקטובר','נובמבר','דצמבר','ינואר','פברואר','מרץ','אפריל','מאי','יוני'].indexOf(month);
  const row=document.querySelector(`.ramzor-row[data-name="${r.n.replace(/"/g,'\\"')}"]`);
  if(row){
    const cells=row.querySelectorAll('td');
    const c=cells[2+mi]; if(c){ const d=c.querySelector('div'); if(d) d.style.background=CLR[r.s[month]||'none']; }
    row.dataset.current = r.s[['ספטמבר','אוקטובר','נובמבר','דצמבר','ינואר','פברואר','מרץ','אפריל','מאי','יוני'].slice().reverse().find(m=>r.s[m]&&r.s[m]!=='none')] || 'none';
  }
}
// טעינת שינויים שמורים בעת עלייה
(function(){ const st=ramzorStore();

    Object.assign(r.s, e.s||{}); Object.assign(r.nt, e.nt||{}); });
})();

window.syncRamzorFromSheet = async function() {
  const btn = document.getElementById('ramzor-sync-btn');
  const status = document.getElementById('ramzor-status-text');
  if (!btn) return;
  
  btn.disabled = true;
  btn.textContent = '⏳ טוען...';
  btn.style.background = '#94a3b8';
  
  const TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSH03-Nu2eEVtVp8fY5kt2kzLrYVlNBfpOdIDr_U8w5LPoMdK6lb2HqLcztyj5jh522O4-hz3R8A5A1/pub?gid=1187652905&single=true&output=tsv';
  
  try {
    const resp = await fetch(TSV_URL);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    
    const lines = text.split(/\r?\n/);
    const months = ['ספטמבר','אוקטובר','נובמבר','דצמבר','ינואר','פברואר','מרץ','אפריל','מאי','יוני'];
    
    // זיהוי סטטוס לפי טקסט בתא
    function detectStatus(txt) {
      if (!txt || !txt.trim()) return 'green';  // תא ריק = ירוק
      const t = txt.toLowerCase();
      // אדום - מילות מפתח של נשירה
      if (/נשירה|עזב|עזיב|לא רוצה להיות בפנימי|מדבר עזיבה|רוצה לעזוב|אין רצון להיות פה|סכנת נוכחות/.test(txt)) {
        return 'red';
      }
      // צהוב - פערים לימודיים, חששות עתידיים
      if (/פערים לימודיים|חשש שלא יצליח|חשש שלא תצליח|בתהליך טוב|במלחמה הוא מאוד בעייתי/.test(txt)) {
        return 'yellow';
      }
      // כתום - שאר ההערות (מעקב, מחסיר, וכו')
      return 'orange';
    }
    
    // נטען את הנתונים החדשים מהגיליון
    let updated = 0;
    let newMonthsFound = new Set();
    
    // שורה 5 בגיליון = שורת כותרות. שורות 6+ = חניכים
    // עמודות (0-indexed): 0=מסד, 1=ריק, 2=קבוצה, 3=שם, 4-12=חודשים
    let currentGroup = '';
    
    for (let i = 5; i < lines.length; i++) {
      const cols = lines[i].split('\t');
      if (cols.length < 5) continue;
      
      const groupCell = (cols[2] || '').trim();
      const nameCell = (cols[3] || '').trim();
      
      if (groupCell) currentGroup = groupCell;
      if (!nameCell) continue;
      
      // נמצא את החניך המתאים ב-RAMZOR_DATA
      const studentIdx = RAMZOR_DATA.findIndex(r => 
        r.n === nameCell || 
        r.n.includes(nameCell) || 
        nameCell.includes(r.n) ||
        (r.n.split(' ').some(w => nameCell.includes(w)) && nameCell.split(' ').some(w => r.n.includes(w)))
      );
      
      if (studentIdx === -1) continue;
      
      // עדכון נתוני החודשים
      for (let m = 0; m < months.length; m++) {
        const cellText = (cols[4 + m] || '').trim();
        const month = months[m];
        const status = detectStatus(cellText);
        
        // עדכון הסטטוס וההערה
        const oldStatus = RAMZOR_DATA[studentIdx].s[month] || 'none';
        if (cellText) {
          RAMZOR_DATA[studentIdx].nt[month] = cellText;
          if (status !== 'green') {
            RAMZOR_DATA[studentIdx].s[month] = status;
            if (oldStatus !== status) updated++;
            // נסמן חודשים שלא היו לנו
            if (oldStatus === 'none') newMonthsFound.add(month);
          }
        }
      }
    }
    
    // עדכון התצוגה - נריץ מחדש את הרינדור של הלשונית
    const ramzorTab = document.querySelector('[data-tab="ramzor"]');
    if (ramzorTab && ramzorTab.click) {
      // נטען מחדש את הסעיף
      show('ramzor');
    }
    
    btn.textContent = '✓ עודכן בהצלחה';
    btn.style.background = '#10b981';
    
    if (status) {
      const newMonthsList = Array.from(newMonthsFound).join(', ');
      status.innerHTML = `${RAMZOR_DATA.length} חניכים | <span style="color:#10b981;font-weight:700;">✓ סונכרן ${new Date().toLocaleTimeString('he-IL')}</span>${newMonthsList ? ' | חודשים חדשים: ' + newMonthsList : ''}`;
    }
    
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '🔄 סנכרן מהגיליון';
      btn.style.background = 'var(--green)';
    }, 3000);
    
  } catch (err) {
    console.error('שגיאת סנכרון:', err);
    btn.textContent = '❌ שגיאה';
    btn.style.background = '#ef4444';
    if (status) {
      status.innerHTML = `<span style="color:#ef4444;">⚠ שגיאת סנכרון: ${err.message}. ייתכן שהמערכת חוסמת את הגישה לגיליון.</span>`;
    }
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '🔄 סנכרן מהגיליון';
      btn.style.background = 'var(--green)';
    }, 4000);
  }
};
</script>
</body>
</html>
